*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#f5f0e8}
body{
  font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",sans-serif;
  color:var(--fg);background:var(--bg);
  -webkit-font-smoothing:antialiased;touch-action:manipulation;
  overscroll-behavior:none;
}
/* iOS keeps the status bar text white, so cream mode gets a brown strip behind it */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--status);z-index:100;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.view{position:fixed;inset:0;background:var(--bg)}

/* ---------- library ---------- */
#lib{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 40px)}
#lib header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.wm{font-family:'Oblata Display',ui-rounded,ui-serif,Georgia,serif;font-weight:400;font-size:44px;letter-spacing:0;margin:0;line-height:1.05;font-synthesis:none}
.actions{display:flex;flex-wrap:wrap;justify-content:flex-end;gap:4px 16px;font-size:16px}
.actions button{color:var(--fg)}
.actions button.dim{color:var(--dim)}
#search{width:100%;margin:0 0 20px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font:16px -apple-system,system-ui,sans-serif;-webkit-appearance:none;outline:none}
#search::placeholder{color:var(--dim)}
#shelf,#cur{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 18px;align-items:start}
@media (min-width:640px){#shelf,#cur{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{min-width:0}
#lib .hl{display:flex;align-items:center;gap:14px;min-width:0}
#menuBtn{flex:none;width:30px;height:30px;display:flex;align-items:center;justify-content:center;margin-left:-6px;color:var(--fg)}
#crumb{margin:-6px 0 18px;font-size:14px;color:var(--dim)}
#vEmpty{margin:40px 0;text-align:center;color:var(--dim);font-size:15px;line-height:1.5}
.sec{margin:0 0 12px;font:500 12px -apple-system,system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--dim)}
#curWrap{margin-bottom:28px}#cur{margin-bottom:26px}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:59;opacity:0;pointer-events:none;transition:opacity .22s}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* =============== settings =============== */
/* highlight palette. Index is what gets saved on each highlight, so only ever add to the end
   (0 butter, 1 sage, 2 dusty blue, 3 blush: the old hot pink, so old highlights keep their slot, 4 lavender).
   `order` is just the left-to-right order in the picker. */
const HLS = [
  {name: 'butter',     hex: '#e6d08a'},
  {name: 'sage',       hex: '#a9c29a'},
  {name: 'dusty blue', hex: '#9db8d0'},
  {name: 'blush',      hex: '#e3a9ab'},
  {name: 'lavender',   hex: '#bda9d6'}
];
const HL_ORDER = [0, 1, 2, 4, 3];
const hlRgba = (i, a) => { const h = (HLS[i] || HLS[0]).hex; return `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`; };
{
  const st = document.createElement('style');
  st.textContent = HLS.map((c, i) => `.dot.c${i}{background:${c.hex}}`).join('');
  document.head.append(st);
  const box = document.querySelector('#hlDots');
  HL_ORDER.forEach(i => {
    const b = document.createElement('button'); b.className = 'dot c' + i; b.dataset.c = i; b.setAttribute('aria-label', HLS[i].name);
    box.append(b);

/* =============== zip reader (no libraries) =============== */
class Zip {
  constructor(blob){ this.blob = blob; this.entries = new Map(); this.lower = new Map(); }
  async init(){
    const size = this.blob.size;
    const tailLen = Math.min(size, 65557);
    const tail = new DataView(await this.blob.slice(size - tailLen, size).arrayBuffer());
    let eocd = -1;
    for (let i = tailLen - 22; i >= 0; i--){
      if (tail.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if (eocd < 0) throw new Error('not a zip');
    const count = tail.getUint16(eocd + 10, true);
    const cdSize = tail.getUint32(eocd + 12, true);
    const cdOff = tail.getUint32(eocd + 16, true);
    const cd = new DataView(await this.blob.slice(cdOff, cdOff + cdSize).arrayBuffer());
    const dec = new TextDecoder();
    let p = 0;
    for (let i = 0; i < count; i++){
      if (cd.getUint32(p, true) !== 0x02014b50) break;
      const method = cd.getUint16(p + 10, true);
      const csize = cd.getUint32(p + 20, true);
      const usize = cd.getUint32(p + 24, true);
      const nlen = cd.getUint16(p + 28, true), elen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
      const off = cd.getUint32(p + 42, true);
      const name = dec.decode(new Uint8Array(cd.buffer, p + 46, nlen));
      const e = {name, method, csize, usize, off};
      this.entries.set(name, e);
      this.lower.set(name.toLowerCase(), e);
      p += 46 + nlen + elen + clen;
    }
  }
  find(name){ return this.entries.get(name) || this.lower.get(name.toLowerCase()) || null; }
  has(name){ return !!this.find(name); }
  async bytes(name){
    const e = this.find(name);
    if (!e) throw new Error('missing ' + name);
    const lh = new DataView(await this.blob.slice(e.off, e.off + 30).arrayBuffer());
    const start = e.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    const raw = this.blob.slice(start, start + e.csize);
    if (e.method === 0) return new Uint8Array(await raw.arrayBuffer());
    if (e.method === 8){
      const stream = raw.stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    throw new Error('unsupported compression');
  }
  async sliceOf(name, type){
    const e = this.find(name);
    if (!e) throw new Error('missing ' + name);
    if (e.method !== 0) return new Blob([await this.bytes(name)], {type});
    const lh = new DataView(await this.blob.slice(e.off, e.off + 30).arrayBuffer());
    const start = e.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    return this.blob.slice(start, start + e.csize, type);
  }
  async text(name){ return new TextDecoder().decode(await this.bytes(name)); }
  async blobOf(name, type){ return new Blob([await this.bytes(name)], {type}); }
}

/* =============== epub parsing =============== */
function walkNav(ol, depth, out, base){
  for (const li of ol.children){
    if (li.tagName !== 'LI') continue;
    const head = [...li.children].find(c => c.tagName === 'A' || c.tagName === 'SPAN');
    if (head){
      const label = head.textContent.trim().replace(/\s+/g, ' ');
      const href = head.tagName === 'A' ? head.getAttribute('href') : null;
      if (href && label) out.push({label, depth, path: resolvePath(base, href), frag: (href.split('#')[1] || '')});
    }
    const sub = [...li.children].find(c => c.tagName === 'OL');
    if (sub) walkNav(sub, depth + 1, out, base);
  }
}
function walkNcx(el, depth, out, base){
  for (const np of el.children){
    if (np.localName !== 'navPoint') continue;
    const lab = q(np, 'text')[0];
    const content = [...np.children].find(c => c.localName === 'content');
    const src = content && content.getAttribute('src');
    const label = lab ? lab.textContent.trim().replace(/\s+/g, ' ') : '';
    if (src && label) out.push({label, depth, path: resolvePath(base, src), frag: (src.split('#')[1] || '')});
    walkNcx(np, depth + 1, out, base);
  }
}
function pickStart(toc, spine, landmark){
  const skip = /^(cover|title|half.?title|copyright|dedication|contents|table of contents|epigraph|acknowledg|also by|about the|praise|map)/i;
  const want = /^(introduction|intro\b|prologue|prelude|chapter\s*(1|one|i)\b|(part|book)\s*(1|one|i)\b|1(?![0-9])|one$|one[:.\-\u2013\u2014]|i[.:]|i$)/i;
  for (const e of toc){
    const l = e.label.trim();
    if (skip.test(l)) continue;
    if (want.test(l)) return {idx: e.idx, frag: e.frag || ''};
  }
  if (landmark){ const idx = spine.findIndex(s => s.path === landmark); if (idx >= 0) return {idx, frag: ''}; }
  return null;
}
async function parseBook(blob){

  const opf = xml(await zip.text(opfPath));
  const dir = dirOf(opfPath);

  const man = new Map(), types = new Map();
  for (const it of q(opf, 'item')){
    const m = {path: resolvePath(dir, it.getAttribute('href') || ''), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || ''};
    man.set(it.getAttribute('id'), m);
    types.set(m.path, m.type);
  }
  const spine = [];
  for (const r of q(opf, 'itemref')){
    const m = man.get(r.getAttribute('idref'));
    if (m && zip.has(m.path)) spine.push({path: m.path});
  }
  if (!spine.length) throw new Error('empty spine');

  const t = q(opf, 'title')[0], a = q(opf, 'creator')[0];
  const title = t ? t.textContent.trim() : '';
  const author = a ? a.textContent.trim() : '';

  let cov = null;
  for (const m of q(opf, 'meta')) if (m.getAttribute('name') === 'cover') cov = man.get(m.getAttribute('content')) || cov;
  if (!cov) for (const m of man.values()) if (/\bcover-image\b/.test(m.props)) cov = m;
  if (cov && !cov.type.startsWith('image')) cov = null;

  let toc = [], landmark = null;
  try {
    const navItem = [...man.values()].find(m => /\bnav\b/.test(m.props));
    if (navItem && zip.has(navItem.path)){
      const d = new DOMParser().parseFromString(await zip.text(navItem.path), 'text/html');
      const navs = [...d.querySelectorAll('nav')];
      const n = navs.find(x => (x.getAttribute('epub:type') || x.getAttribute('type') || '').includes('toc')) || navs[0];
      const ol = n && n.querySelector('ol');
      if (ol) walkNav(ol, 0, toc, dirOf(navItem.path));
      const lm = navs.find(x => (x.getAttribute('epub:type') || x.getAttribute('type') || '').includes('landmarks'));
      if (lm){
        const la = [...lm.querySelectorAll('a')].find(x => /bodymatter/.test(x.getAttribute('epub:type') || x.getAttribute('type') || ''));
        if (la) landmark = resolvePath(dirOf(navItem.path), la.getAttribute('href') || '');
      }
    }
    if (!toc.length){
      const ncx = [...man.values()].find(m => m.type === 'application/x-dtbncx+xml');
      if (ncx && zip.has(ncx.path)){
        const d = xml(await zip.text(ncx.path));

    for (const r of q(opf, 'reference')){
      if (/^(text|bodymatter)$/i.test(r.getAttribute('type') || '')){ landmark = resolvePath(dir, r.getAttribute('href') || ''); break; }
    }
  }

  let total = 0;
  for (const s of spine){
    const e = zip.find(s.path);
    s.w = Math.max(1, e ? e.usize : 1);
    s.start = total;
    total += s.w;
  }
  return {zip, title, author, spine, toc, total, types, start: pickStart(toc, spine, landmark), coverPath: cov && cov.path, coverType: cov && cov.type};
}
async function shrinkCover(blob){

    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || blob), 'image/jpeg', .82));
  } catch (e) { return blob; }
}

/* Covers are stored inside the book record as plain bytes (coverBuf), not as a Blob. A Blob read back from IndexedDB stays tied
   to the file that backed it, and on iOS that file can vanish when the record is saved again (which reading does constantly),
   leaving the cover blank. Bytes have no such tie. */

}

async function fixCovers(){

    try {
      if (b.coverBuf && b.coverBuf.byteLength){ if (b.cover){ delete b.cover; await dbPut('books', b); } continue; }
      let pack = b.cover instanceof Blob ? await packCover(b.cover) : {};
      let dirty = false;
      if (!pack.coverBuf && !b.coverTried){
        const file = await dbGet('files', b.id);
        let c = null, offline = false;
        if (file){
          if (b.kind === 'pdf'){ try { c = (await parsePdfInfo(file)).cover; } catch (e) { offline = !!(e && e.message === 'PDFJS_OFFLINE'); } }
          else { try { const bk = await parseBook(file); if (bk.coverPath) c = await shrinkCover(await bk.zip.blobOf(bk.coverPath, bk.coverType)); } catch (e) {} }
        }
        pack = await packCover(c);
        if (!offline){ b.coverTried = true; dirty = true; }
      }
      if (pack.coverBuf){ Object.assign(b, pack); changed = true; dirty = true; }
      if (b.cover && !pack.coverBuf){ changed = true; dirty = true; }
      if (b.cover) delete b.cover;
      if (dirty) await dbPut('books', b);
    } catch (e) { console.error(e); }
  }
  return changed;
}

    else {

function lenEm(v, lo, hi){
  const m = /^(-?\d*\.?\d+)(em|rem|px|pt|%|ex|ch)?$/i.exec(String(v).trim());
  if (!m) return false;
  let n = parseFloat(m[1]); const u = (m[2] || 'px').toLowerCase();
  if (u === 'px') n /= 16; else if (u === 'pt') n /= 12; else if (u === '%') n *= .22; else if (u === 'ex' || u === 'ch') n *= .5;

  'font-variant-caps': kw(/^(small-caps|all-small-caps|normal)$/i),
  'text-transform': kw(/^(uppercase|lowercase|capitalize|none)$/i),
  'text-decoration': kw(/^(underline|line-through|none)$/i),
  'text-decoration-line': kw(/^(underline|line-through|none)$/i),
  'text-align': v => v === 'justify' ? 'var(--just,justify)' : (/^(left|right|center)$/i.test(v) && v),
  'vertical-align': kw(/^(super|sub|baseline)$/i),
  'white-space': v => /^(pre|pre-wrap|pre-line|normal)$/i.test(v) && (v === 'pre' ? 'pre-wrap' : v),
  'list-style-type': kw(/^(disc|circle|square|decimal|lower-alpha|upper-alpha|lower-roman|upper-roman|none)$/i),
  'text-indent': v => lenEm(v, -3, 3),
  'margin-left': v => lenEm(v, -1, 4), 'margin-right': v => lenEm(v, 0, 4),
  'padding-left': v => lenEm(v, 0, 4), 'padding-right': v => lenEm(v, 0, 4),
  'margin-top': v => lenEm(v, 0, 3), 'margin-bottom': v => lenEm(v, 0, 3),

async function runSearch(q, res, st){

  const pdf = R.kind === 'pdf', total = pdf ? P.n : R.book.spine.length;
  let count = 0;
  for (let i = 0; i < total && count < 150; i++){
    if (tok !== srchTok) return;

    const t = pdf ? await pageText(i + 1) : await chText(i);
    if (tok !== srchTok) return;
    let at = 0, k;
    while ((k = t.low.indexOf(needle, at)) >= 0 && count < 150){
      at = k + needle.length; count++;
      const h = {i, off: k, len: needle.length};
      const b = document.createElement('button'); b.className = 'toc';
      const bf = t.raw.slice(Math.max(0, k - 45), k).replace(/\s+/g, ' ').replace(/^\S*\s/, ''), af = t.raw.slice(k + needle.length, k + needle.length + 60).replace(/\s+/g, ' ');

const dayKey = (d = new Date()) => new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10);

const fmtDur = s => { const m = Math.round(s / 60); if (m < 1) return '<1m'; const h = Math.floor(m / 60), r = m % 60; return h ? (r ? h + 'h ' + r + 'm' : h + 'h') : m + 'm'; };

  if (document.hidden || !R.meta || !R.kind || $('#reader').hidden || Date.now() - actAt > 120000){ lastBP = null; return; }
  R.meta.secs = (R.meta.secs || 0) + 5;
  const dd = DAYS(), k = dayKey(); dd[k] = (dd[k] || 0) + 5;
  if (R.kind !== 'pdf' && R.book && R.ready){
    const bp = bytePos(); S.rdT = (S.rdT || 0) + 5;
    if (lastBP !== null){ const d = bp - lastBP; if (d > 0 && d < 6000) S.rdB = (S.rdB || 0) + d; }
    lastBP = bp;
  }
  if (++tickN % 6 === 0){
    const ks = Object.keys(dd).sort(); while (ks.length > 400) delete dd[ks.shift()];
    saveSettings(); dbPut('books', R.meta).catch(() => {});

}, 5000);

  const d = DAYS(), c = new Date(); let n = 0;
  if ((d[dayKey(c)] || 0) < 60) c.setDate(c.getDate() - 1);

}
function buildStats(body){
  const d = DAYS(), now = new Date(), days = [];
  for (let k = 6; k >= 0; k--){ const c = new Date(now); c.setDate(c.getDate() - k); days.push({l: 'SMTWTFS'[c.getDay()], v: d[dayKey(c)] || 0}); }
  const week = days.reduce((a, x) => a + x.v, 0), max = Math.max(60, ...days.map(x => x.v));
  let month = 0; for (let k = 0; k < 30; k++){ const c = new Date(now); c.setDate(c.getDate() - k); month += d[dayKey(c)] || 0; }
  const yr = now.getFullYear(), fin = lib.filter(b => b.finishedAt && new Date(b.finishedAt).getFullYear() === yr).length;
  const total = lib.reduce((a, b) => a + (b.secs || 0), 0), st = streak();
  const card = (v, l) => `<div class="scard"><b>${v}</b><span>${l}</span></div>`;
  body.innerHTML = `<div class="stats"><div class="sgrid">${card(fmtDur(d[dayKey()] || 0), 'today')}${card(st + (st === 1 ? ' day' : ' days'), 'reading streak')}${card(fmtDur(week), 'last 7 days')}${card(fmtDur(month), 'last 30 days')}${card(fin, 'finished in ' + yr)}${card(fmtDur(total), 'all time')}</div>
    <div class="sbars">${days.map(x => `<div><i style="height:${Math.round(x.v / max * 100)}%"></i>${x.l}</div>`).join('')}</div>
    <h3>most read</h3><div id="stBooks"></div></div>`;

}

async function mLoad(){
  const cid = MU.tracks[MU.cur] && MU.tracks[MU.cur].id;
  try { MU.tracks = (await mDo(['tracks'], 'readonly', st => st.getAll())).sort((a, b) => a.added - b.added); } catch (e) { MU.tracks = []; }
  MU.cur = cid ? MU.tracks.findIndex(t => t.id === cid) : -1;
  musicRefresh();
}
async function mAddFiles(files){
  let n = 0;
  for (const f of files){
    if (!/^audio\//.test(f.type) && !/\.(mp3|m4a|aac|wav|flac|ogg|opus)$/i.test(f.name)) continue;
    const id = 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
    try {
      await mDo(['tracks', 'blobs'], 'readwrite', (a, b) => { b.put(f, id); return a.put({id, name: f.name.replace(/\.[^.]+$/, '').replace(/_+/g, ' ').trim() || 'track', added: Date.now() + n, size: f.size}); });
      n++;
    } catch (e) { toast('could not save ' + f.name); }
  }
  await mLoad(); if (n) toast(n + (n === 1 ? ' song added' : ' songs added'));
}
function mUnlock(){
  if (MU.unlocked) return; MU.unlocked = true;
  if (!mAu.src){ mAu.src = 'data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEARKwAAIhYAQACABAAZGF0YQAAAAA='; mAu.play().catch(() => {}); }
}
async function mPlay(i){
  const t = MU.tracks[i]; if (!t) return;
  let blob; try { blob = await mDo(['blobs'], 'readonly', b => b.get(t.id)); } catch (e) {}
  if (!blob){ toast('that file is missing'); return; }
  if (MU.url) URL.revokeObjectURL(MU.url);
  MU.url = URL.createObjectURL(blob); MU.cur = i; S.mLast = t.id; saveSettings();
  mAu.src = MU.url;
  try { await mAu.play(); } catch (e) { toast('tap play to start'); }
  try { if ('mediaSession' in navigator) navigator.mediaSession.metadata = new MediaMetadata({title: t.name, artist: 'alcove.'}); } catch (e) {}
  musicRefresh();
}
function mToggle(){
  if (!MU.tracks.length) return;
  if (MU.cur < 0 || !MU.url){ const k = MU.tracks.findIndex(t => t.id === S.mLast); mPlay(k >= 0 ? k : 0); return; }
  if (mAu.paused) mAu.play().catch(() => {}); else mAu.pause();
}
function mNext(auto){
  const n = MU.tracks.length; if (!n) return;
  if (auto && S.mRep === 'one'){ mAu.currentTime = 0; mAu.play().catch(() => {}); return; }
  let i;
  if (S.mShuf && n > 1){ do { i = Math.floor(Math.random() * n); } while (i === MU.cur); }
  else { i = MU.cur + 1; if (i >= n){ if (auto && S.mRep === 'off'){ mAu.pause(); return; } i = 0; } }
  mPlay(i);
}
function mPrev(){
  if (mAu.currentTime > 3){ mAu.currentTime = 0; return; }
  const n = MU.tracks.length; if (n) mPlay((Math.max(MU.cur, 0) - 1 + n) % n);
}
async function mDelete(i){
  const t = MU.tracks[i]; if (!t || !confirm('Remove "' + t.name + '" from alcove.?')) return;
  if (i === MU.cur){ mAu.pause(); mAu.removeAttribute('src'); mAu.load(); if (MU.url) URL.revokeObjectURL(MU.url); MU.url = null; MU.cur = -1; }
  try { await mDo(['tracks', 'blobs'], 'readwrite', (a, b) => { b.delete(t.id); return a.delete(t.id); }); } catch (e) {}
  await mLoad();
}

}

function secOf(node){
  const el = node && (node.nodeType === 1 ? node : node.parentElement);
  return el && el.closest ? el.closest('.a-ch') : null;
}
function charOffset(sec, node, off){
  const r = sec.ownerDocument.createRange(); r.selectNodeContents(sec); r.setEnd(node, off); return r.toString().length;
}
function textPos(sec, off, isEnd){
  const w = sec.ownerDocument.createTreeWalker(sec, 4); let n, acc = 0, last = null;
  while ((n = w.nextNode())){
    const l = n.data.length;
    if (isEnd ? off <= acc + l : off < acc + l) return {n, o: off - acc};
    acc += l; last = n;
  }
  return last && off === acc ? {n: last, o: last.data.length} : null;
}
function rangeAt(sec, off){
  const p = textPos(sec, off, false); if (!p) return null;
  const r = sec.ownerDocument.createRange(); r.setStart(p.n, p.o); r.setEnd(p.n, Math.min(p.n.data.length, p.o + 1)); return r;
}
function targetRect(t){
  const d = R.doc; if (!d) return null;
  const rectOf = el => el.getClientRects()[0] || el.getBoundingClientRect();
  if (t.frag !== undefined){ const el = findFrag(t.frag); if (el) return rectOf(el); }
  if (t.hl){ const el = d.querySelector('mark.a-hl[data-id="' + t.hl + '"]'); if (el) return rectOf(el); }
  if (t.off !== undefined && t.off !== null){
    const sec = d.querySelector('.a-ch[data-i="' + R.i + '"]');
    const r = sec && rangeAt(sec, t.off);
    if (r){ const rc = rectOf(r); if (rc && (rc.width || rc.height)) return rc; }
  }
  return null;
}
function wordRange(d, x, y){
  const r = d.caretRangeFromPoint ? d.caretRangeFromPoint(x, y) : null;
  if (!r || r.startContainer.nodeType !== 3) return null;
  const t = r.startContainer.data; let a = r.startOffset, b = a;
  while (a > 0 && /\S/.test(t[a - 1])) a--;
  while (b < t.length && /\S/.test(t[b])) b++;
  if (a === b) return null;
  const w = d.createRange(); w.setStart(r.startContainer, a); w.setEnd(r.startContainer, b); return w;
}
function caretAt(d, x, y, dir){
  for (let k = 0; k < 8; k++){
    const c = d.caretRangeFromPoint ? d.caretRangeFromPoint(x, y + k * 28 * (dir || 1)) : null;
    if (c && c.startContainer.nodeType === 3){
      const sec = secOf(c.startContainer);
      if (sec) return {i: Number(sec.dataset.i), off: charOffset(sec, c.startContainer, c.startOffset)};
    }
  }
  return null;
}
function currentAnchor(){
  if (!R.doc || !R.geo || R.kind === 'pdf') return null;

    for (const dy of [6, 30, 60, 100]){
      const a = S.layout === 'pages' ? caretAt(R.doc, g.px + 8, g.py + dy) : caretAt(R.doc, g.px + 8, dy + 14);

}
function visibleRange(){

  try { b = S.layout === 'pages' ? caretAt(R.doc, g.w - g.px - 12, g.h - g.py - 12, -1) : caretAt(R.doc, g.px + 8, g.h - 24, -1); } catch (e) {}
  return {i: a.i, a: a.off, b: (b && b.i === a.i && b.off >= a.off) ? b.off : a.off + 2500};
}

/* ---- highlights ---- */
function applyHl(sec, h){
  if (sec.querySelector('mark.a-hl[data-id="' + h.id + '"]')) return;
  const a = textPos(sec, h.s, false), b = textPos(sec, h.e, true);
  if (!a || !b) return;
  const d = sec.ownerDocument, nodes = [], w = d.createTreeWalker(sec, 4);
  let n, inside = false;
  while ((n = w.nextNode())){
    if (n === a.n) inside = true;
    if (inside) nodes.push(n);
    if (n === b.n) break;
  }
  nodes.forEach(node => {
    const so = node === a.n ? a.o : 0, eo = node === b.n ? b.o : node.data.length;
    if (eo <= so) return;
    const r = d.createRange(); r.setStart(node, so); r.setEnd(node, eo);
    const m = d.createElement('mark'); m.className = 'a-hl c' + h.c; m.dataset.id = h.id;
    try { r.surroundContents(m); } catch (e) {}
  });
}
function hlApply(sec){
  if (!sec || !R.meta) return;
  const i = Number(sec.dataset.i);
  (R.meta.hl || []).filter(h => h.i === i).sort((x, y) => x.t - y.t).forEach(h => applyHl(sec, h));
}
function removeHlDom(id){
  if (!R.doc) return;
  R.doc.querySelectorAll('mark.a-hl[data-id="' + id + '"]').forEach(m => {
    const p = m.parentNode; m.replaceWith(...m.childNodes); p.normalize();

}
function createHighlight(range, c){
  const sec = secOf(range.commonAncestorContainer);
  if (!sec){ toast("can't highlight across chapters"); return; }
  const s = charOffset(sec, range.startContainer, range.startOffset), e = charOffset(sec, range.endContainer, range.endOffset);
  if (e - s < 1) return;
  const h = {id: uid(), i: Number(sec.dataset.i), s, e, c, text: range.toString().replace(/\s+/g, ' ').trim().slice(0, 500), t: Date.now()};
  if (!R.meta.hl) R.meta.hl = [];
  R.meta.hl.push(h); applyHl(sec, h); saveMarks();
}

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  else { const r = x.stream().getReader(); for (;;){ const {done, value} = await r.read(); if (done) break; c = crcUpdate(c, value); } }
  return (c ^ 0xFFFFFFFF) >>> 0;
}

    if (onProg) onProg(++n, entries.length);
    const data = e.bytes || e.blob, size = e.bytes ? e.bytes.length : e.blob.size;
    if (size > 0xFFFFFFFF) throw new Error('a file is too large for the backup format');
    const crc = await crcOf(data), nm = enc.encode(e.name);

    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, nm.length, true);
    parts.push(lh.buffer, nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);
    ch.setUint16(12, dt, true); ch.setUint16(14, dd, true); ch.setUint32(16, crc, true); ch.setUint32(20, size, true); ch.setUint32(24, size, true);
    ch.setUint16(28, nm.length, true); ch.setUint32(42, off, true);

    toast('clearing shelf…', true);
    for (const b of await dbAll()) await delBook(b.id);
    if (pkg.settings && typeof pkg.settings === 'object'){
      for (const k of Object.keys(S)) if (k in pkg.settings && typeof pkg.settings[k] === typeof S[k]) S[k] = pkg.settings[k];
      if (THEME_MIGRATE[S.theme]) S.theme = THEME_MIGRATE[S.theme];
      saveSettings(); applyTheme();
    }
  }
  const existing = await dbAll();
  const norm = b => (b.title + '|' + b.author).trim().toLowerCase();
  let n = 0;
  for (const rec of pkg.books){
    toast(`importing ${++n} of ${pkg.books.length}…`, true);
    const hit = existing.find(b => b.id === rec.id) || (rec.sig && existing.find(b => b.sig === rec.sig)) || (rec.title && existing.find(b => norm(b) === norm(rec)));
    if (hit){ mergeInto(hit, rec); await dbPut('books', hit); res.merged++; continue; }
    if (pkg.kind !== 'full' || !rec.file || !pkg.zip.has(rec.file)){ res.skipped++; continue; }
    try {
      const type = rec.kind === 'pdf' ? 'application/pdf' : 'application/epub+zip';
      const file = await pkg.zip.sliceOf(rec.file, type);
      const meta = {...rec, cover: null}; delete meta.file; delete meta.cover;
      if (rec.cover && pkg.zip.has(rec.cover)) Object.assign(meta, await packCover(await pkg.zip.sliceOf(rec.cover, 'image/jpeg')));
      meta.coverTried = true;
      meta.v = 2;
      await dbPut('files', file, meta.id); await dbPut('books', meta);
      if (meta.pos){ try { localStorage.setItem('alcove.pos.' + meta.id, JSON.stringify(meta.pos)); } catch (e) {} }
      existing.push(meta); res.added++;
    } catch (e) { console.error(e); res.skipped++; }
  }
  return res;
}

gz.addEventListener('touchend', e => {
  clearTimeout(lpTimer);
  if (CS && CS.active){ e.preventDefault(); touchTap = R.lastAct = Date.now(); endSel(); return; }
  const t = e.changedTouches[0], dx = t.clientX - gx, dy = t.clientY - gy;
  touchTap = R.lastAct = Date.now();
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.4){ setChrome(false); if (dx < 0) next(); else prev(); }
  else if (Math.abs(dx) < 12 && Math.abs(dy) < 12){ e.preventDefault(); tapAt(t.clientX, t.clientY); }
  else if (S.layout === 'scroll') setChrome(false);
}, {passive: false});
gz.addEventListener('click', e => { if (Date.now() - touchTap < 700) return; tapAt(e.clientX, e.clientY); });
addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (!lb.hidden) closeLightbox(); else if (!$('#sheet').hidden) closeSheet(); else setChrome(false); return; }
  if (!R.book || $('#reader').hidden) return;
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
});
let lastTop = -1;
setInterval(() => {
  if (!R.doc || !R.book || S.layout !== 'scroll' || $('#reader').hidden) return;
  try {
    const se = R.doc.scrollingElement || R.doc.documentElement;
    if (se.scrollTop !== lastTop){ lastTop = se.scrollTop; scrollUpdate(); }
    extend();
  } catch (e) {}
}, 250);
let rz;
function relayout(){
  if (R.kind === 'pdf' && P.doc){ const pg = P.cur, fr = P.frac; pdfLayout(true); pdfGoto(pg, fr); }
  else if (R.doc) applyLayout();
}
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(relayout, 150); });
addEventListener('orientationchange', () => { clearTimeout(rz); rz = setTimeout(relayout, 350); });
addEventListener('popstate', () => {
  if ($('#reader').hidden) return;
  if (!$('#lb').hidden){ closeLightbox(); try { history.pushState({r: 1}, ''); } catch (e) {} return; }
  if (!$('#sheet').hidden){ closeSheet(); try { history.pushState({r: 1}, ''); } catch (e) {} return; }
  closeBook(true);
});
addEventListener('pagehide', () => { flushSave(); saveSettings(); });
document.addEventListener('visibilitychange', () => { if (document.hidden){ flushSave(); saveSettings(); } });

applyTheme();
{
  let last = null; try { last = localStorage.getItem('alcove.last'); } catch (e) {}
  const sp = $('#splash');
  if (last) sp.remove();
  else { sp.hidden = false; setTimeout(() => { sp.classList.add('out'); setTimeout(() => sp.remove(), 450); }, 800); }
}
loadLib().then(() => {
  let last = null;
  try { last = localStorage.getItem('alcove.last'); } catch (e) {}
  if (last && lib.some(b => b.id === last)) openBook(last);
}).catch(e => { console.error(e); toast('storage is unavailable here'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
