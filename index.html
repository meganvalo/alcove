*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;height:100%;background:#2b1b17}
body{
  font:16px/1.4 -apple-system,system-ui,"Helvetica Neue",sans-serif;
  color:var(--fg);background:var(--bg);
  -webkit-font-smoothing:antialiased;touch-action:manipulation;
  overscroll-behavior:none;
}
body{--accent:#d0ab77;--on-accent:#2b1b17}
body[data-theme=espresso]{--bg:#2b1b17;--fg:#eadfcd;--dim:#a39384;--line:#43302a;--chrome:rgba(43,27,23,.9);--tile:#38251f;--status:#2b1b17}
body[data-theme=black]{--bg:#000;--fg:#e8e8e8;--dim:#8a8a8e;--line:#2a2a2c;--chrome:rgba(0,0,0,.86);--tile:#121212;--status:#000}
body[data-theme=graphite]{--bg:#1c1c1e;--fg:#ececee;--dim:#98989d;--line:#3a3a3c;--chrome:rgba(28,28,30,.9);--tile:#2a2a2c;--status:#1c1c1e}
body[data-theme=light]{--bg:#f6f1e6;--fg:#3a231c;--dim:#85756b;--line:#e0d6c3;--chrome:rgba(246,241,230,.92);--tile:#ece3d1;--status:#3a231c;--accent:#b4854a;--on-accent:#fbf6ec}
/* iOS keeps the status bar text white, so cream mode gets a brown strip behind it */
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top);background:var(--status);z-index:100;pointer-events:none}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
.view{position:fixed;inset:0;background:var(--bg)}

/* ---------- library ---------- */
#lib{overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:calc(env(safe-area-inset-top) + 18px) 20px calc(env(safe-area-inset-bottom) + 40px)}
#lib header{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:18px}
.wm{font-family:'Matcha Mint',ui-rounded,ui-serif,Georgia,serif;font-weight:400;font-size:40px;letter-spacing:0;margin:0;line-height:1.05;font-synthesis:none}
.actions{display:flex;gap:20px;font-size:17px}
.actions button{color:var(--fg)}
.actions button.dim{color:var(--dim)}
#search{width:100%;margin:0 0 20px;padding:10px 14px;border-radius:10px;border:1px solid var(--line);
  background:transparent;color:var(--fg);font:16px -apple-system,system-ui,sans-serif;-webkit-appearance:none;outline:none}
#search::placeholder{color:var(--dim)}
#shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:26px 18px;align-items:start}
@media (min-width:640px){#shelf{grid-template-columns:repeat(4,minmax(0,1fr))}}
.item{min-width:0}
.tile{display:block;text-align:left;width:100%;min-width:0;max-width:100%}
.cover{position:relative;width:100%;border-radius:4px;overflow:hidden;background:var(--tile);border:1px solid var(--line)}
.cover::before{content:"";display:block;padding-top:150%}
.cover img{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;display:block}
.cover .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;
  padding:14px;font:600 17px/1.25 ui-serif,Georgia,serif;overflow:hidden}
.bar{position:absolute;left:0;right:0;bottom:0;height:3px;background:rgba(255,255,255,.18)}
.bar i{display:block;height:100%;background:var(--accent)}
.t{margin-top:9px;font-size:15px;font-weight:500;line-height:1.25;min-height:2.5em;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.a{margin-top:2px;font-size:13px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bkFoot{margin-top:44px;text-align:center}
#bkFoot button{color:var(--dim);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:6px 10px}
#bkNote{margin-top:2px;font-size:12px;color:var(--dim)}

<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* =============== settings =============== */
/* highlight palette. Index is what gets saved on each highlight, so only ever add to the end
   (0 butter, 1 sage, 2 dusty blue, 3 blush: the old hot pink, so old highlights keep their slot, 4 lavender).
   `order` is just the left-to-right order in the picker. */
const HLS = [
  {name: 'butter',     hex: '#e6d08a'},
  {name: 'sage',       hex: '#a9c29a'},
  {name: 'dusty blue', hex: '#9db8d0'},
  {name: 'blush',      hex: '#e3a9ab'},
  {name: 'lavender',   hex: '#bda9d6'}
];
const HL_ORDER = [0, 1, 2, 4, 3];
const hlRgba = (i, a) => { const h = (HLS[i] || HLS[0]).hex; return `rgba(${parseInt(h.slice(1, 3), 16)},${parseInt(h.slice(3, 5), 16)},${parseInt(h.slice(5, 7), 16)},${a})`; };
{
  const st = document.createElement('style');
  st.textContent = HLS.map((c, i) => `.dot.c${i}{background:${c.hex}}`).join('');
  document.head.append(st);
  const box = document.querySelector('#hlDots');
  HL_ORDER.forEach(i => {
    const b = document.createElement('button'); b.className = 'dot c' + i; b.dataset.c = i; b.setAttribute('aria-label', HLS[i].name);
    box.append(b);
  });
}
const THEMES = {
  espresso: {bg:'#2b1b17', fg:'#e6dccb', dim:'#9a8a7c', sel:'rgba(208,171,119,.32)'},
  black:    {bg:'#000000', fg:'#d6d6d6', dim:'#7e7e82', sel:'rgba(208,171,119,.30)'},
  graphite: {bg:'#1c1c1e', fg:'#dcdcde', dim:'#8e8e93', sel:'rgba(208,171,119,.30)'},
  light:    {bg:'#f6f1e6', fg:'#3a2a25', dim:'#85756b', sel:'rgba(180,133,74,.28)'}
};
let S = {size:19, font:'serif', theme:'espresso', layout:'pages', margin:'normal', spacing:'normal', pdf:'auto', sort:'recent'};
try { Object.assign(S, JSON.parse(localStorage.getItem('alcove.settings') || '{}')); } catch (e) {}
function saveSettings(){ try { localStorage.setItem('alcove.settings', JSON.stringify(S)); } catch (e) {} }
const darkQ = matchMedia('(prefers-color-scheme: dark)');
function theme(){ return S.theme === 'auto' ? (darkQ.matches ? 'espresso' : 'light') : (THEMES[S.theme] ? S.theme : 'espresso'); }
function applyTheme(){
  const th = theme();
  document.body.dataset.theme = th;
  const inv = S.pdf === 'inverted' || (S.pdf !== 'original' && th !== 'light');
  document.body.dataset.pdf = inv ? 'inv' : 'norm';
  const bg = THEMES[th].bg;
  document.documentElement.style.background = bg;
  document.querySelector('meta[name=theme-color]').setAttribute('content', th === 'light' ? '#3a231c' : bg);
}
if (darkQ.addEventListener) darkQ.addEventListener('change', () => { if (S.theme === 'auto'){ applyTheme(); if (R.doc) applyLayout(); } });

/* =============== tiny helpers =============== */
let toastTimer;
function toast(msg, sticky){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}
const hideToast = () => $('#toast').classList.remove('on');
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
function resolvePath(dir, href){
  href = href.split('#')[0].split('?')[0];
  let p = href;
  try { p = decodeURIComponent(href); } catch (e) {}
  const parts = (p.startsWith('/') ? p.slice(1) : dir + p).split('/');
  const out = [];
  for (const s of parts){ if (s === '..') out.pop(); else if (s && s !== '.') out.push(s); }
  return out.join('/');
}
const xml = t => new DOMParser().parseFromString(t.replace(/^\uFEFF/, ''), 'application/xml');
const q = (doc, name) => [...doc.getElementsByTagNameNS('*', name)];
/* dates */
const lastRead = b => Math.max(b.lastReadAt || 0, b.opened || 0);
const fmtDate = t => t ? new Date(t).toLocaleDateString(undefined, {year: 'numeric', month: 'short', day: 'numeric'}) : '';
const fmtStamp = t => t ? new Date(t).toLocaleString(undefined, {dateStyle: 'medium', timeStyle: 'short'}) : 'not yet';
const toInput = t => { if (!t) return ''; const d = new Date(t); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fromInput = v => { if (!v) return 0; const [y, m, d] = v.split('-').map(Number); return new Date(y, m - 1, d, 12).getTime(); };
const MIME = {jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml'};

/* =============== zip reader (no libraries) =============== */
class Zip {
  constructor(blob){ this.blob = blob; this.entries = new Map(); this.lower = new Map(); }
  async init(){
    const size = this.blob.size;
    const tailLen = Math.min(size, 65557);
    const tail = new DataView(await this.blob.slice(size - tailLen, size).arrayBuffer());
    let eocd = -1;
    for (let i = tailLen - 22; i >= 0; i--){
      if (tail.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if (eocd < 0) throw new Error('not a zip');
    const count = tail.getUint16(eocd + 10, true);
    const cdSize = tail.getUint32(eocd + 12, true);
    const cdOff = tail.getUint32(eocd + 16, true);
    const cd = new DataView(await this.blob.slice(cdOff, cdOff + cdSize).arrayBuffer());
    const dec = new TextDecoder();
    let p = 0;
    for (let i = 0; i < count; i++){
      if (cd.getUint32(p, true) !== 0x02014b50) break;
      const method = cd.getUint16(p + 10, true);
      const csize = cd.getUint32(p + 20, true);
      const usize = cd.getUint32(p + 24, true);
      const nlen = cd.getUint16(p + 28, true), elen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
      const off = cd.getUint32(p + 42, true);
      const name = dec.decode(new Uint8Array(cd.buffer, p + 46, nlen));
      const e = {name, method, csize, usize, off};
      this.entries.set(name, e);
      this.lower.set(name.toLowerCase(), e);
      p += 46 + nlen + elen + clen;
    }
  }
  find(name){ return this.entries.get(name) || this.lower.get(name.toLowerCase()) || null; }
  has(name){ return !!this.find(name); }
  async bytes(name){
    const e = this.find(name);
    if (!e) throw new Error('missing ' + name);
    const lh = new DataView(await this.blob.slice(e.off, e.off + 30).arrayBuffer());
    const start = e.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    const raw = this.blob.slice(start, start + e.csize);
    if (e.method === 0) return new Uint8Array(await raw.arrayBuffer());
    if (e.method === 8){
      const stream = raw.stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    throw new Error('unsupported compression');
  }
  async sliceOf(name, type){
    const e = this.find(name);
    if (!e) throw new Error('missing ' + name);
    if (e.method !== 0) return new Blob([await this.bytes(name)], {type});
    const lh = new DataView(await this.blob.slice(e.off, e.off + 30).arrayBuffer());
    const start = e.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    return this.blob.slice(start, start + e.csize, type);
  }
  async text(name){ return new TextDecoder().decode(await this.bytes(name)); }
  async blobOf(name, type){ return new Blob([await this.bytes(name)], {type}); }
}

/* =============== epub parsing =============== */
function walkNav(ol, depth, out, base){
  for (const li of ol.children){
    if (li.tagName !== 'LI') continue;
    const head = [...li.children].find(c => c.tagName === 'A' || c.tagName === 'SPAN');
    if (head){
      const label = head.textContent.trim().replace(/\s+/g, ' ');
      const href = head.tagName === 'A' ? head.getAttribute('href') : null;
      if (href && label) out.push({label, depth, path: resolvePath(base, href), frag: (href.split('#')[1] || '')});
    }
    const sub = [...li.children].find(c => c.tagName === 'OL');
    if (sub) walkNav(sub, depth + 1, out, base);
  }
}
function walkNcx(el, depth, out, base){
  for (const np of el.children){
    if (np.localName !== 'navPoint') continue;
    const lab = q(np, 'text')[0];
    const content = [...np.children].find(c => c.localName === 'content');
    const src = content && content.getAttribute('src');
    const label = lab ? lab.textContent.trim().replace(/\s+/g, ' ') : '';
    if (src && label) out.push({label, depth, path: resolvePath(base, src), frag: (src.split('#')[1] || '')});
    walkNcx(np, depth + 1, out, base);
  }
}
function pickStart(toc, spine, landmark){
  const skip = /^(cover|title|half.?title|copyright|dedication|contents|table of contents|epigraph|acknowledg|also by|about the|praise|map)/i;
  const want = /^(introduction|intro\b|prologue|prelude|chapter\s*(1|one|i)\b|(part|book)\s*(1|one|i)\b|1(?![0-9])|one$|one[:.\-\u2013\u2014]|i[.:]|i$)/i;
  for (const e of toc){
    const l = e.label.trim();
    if (skip.test(l)) continue;
    if (want.test(l)) return {idx: e.idx, frag: e.frag || ''};
  }
  if (landmark){ const idx = spine.findIndex(s => s.path === landmark); if (idx >= 0) return {idx, frag: ''}; }
  return null;
}
async function parseBook(blob){
  const zip = new Zip(blob);
  await zip.init();
  const cx = xml(await zip.text('META-INF/container.xml'));
  const opfPath = decodeURIComponent(q(cx, 'rootfile')[0].getAttribute('full-path'));
  const opf = xml(await zip.text(opfPath));
  const dir = dirOf(opfPath);

  const man = new Map(), types = new Map();
  for (const it of q(opf, 'item')){
    const m = {path: resolvePath(dir, it.getAttribute('href') || ''), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || ''};
    man.set(it.getAttribute('id'), m);
    types.set(m.path, m.type);
  }
  const spine = [];
  for (const r of q(opf, 'itemref')){
    const m = man.get(r.getAttribute('idref'));
    if (m && zip.has(m.path)) spine.push({path: m.path});
  }
  if (!spine.length) throw new Error('empty spine');

  const t = q(opf, 'title')[0], a = q(opf, 'creator')[0];
  const title = t ? t.textContent.trim() : '';
  const author = a ? a.textContent.trim() : '';

  let cov = null;
  for (const m of q(opf, 'meta')) if (m.getAttribute('name') === 'cover') cov = man.get(m.getAttribute('content')) || cov;
  if (!cov) for (const m of man.values()) if (/\bcover-image\b/.test(m.props)) cov = m;
  if (cov && !cov.type.startsWith('image')) cov = null;

  let toc = [], landmark = null;
  try {
    const navItem = [...man.values()].find(m => /\bnav\b/.test(m.props));
    if (navItem && zip.has(navItem.path)){
      const d = new DOMParser().parseFromString(await zip.text(navItem.path), 'text/html');
      const navs = [...d.querySelectorAll('nav')];
      const n = navs.find(x => (x.getAttribute('epub:type') || x.getAttribute('type') || '').includes('toc')) || navs[0];
      const ol = n && n.querySelector('ol');
      if (ol) walkNav(ol, 0, toc, dirOf(navItem.path));
      const lm = navs.find(x => (x.getAttribute('epub:type') || x.getAttribute('type') || '').includes('landmarks'));
      if (lm){
        const la = [...lm.querySelectorAll('a')].find(x => /bodymatter/.test(x.getAttribute('epub:type') || x.getAttribute('type') || ''));
        if (la) landmark = resolvePath(dirOf(navItem.path), la.getAttribute('href') || '');
      }
    }
    if (!toc.length){
      const ncx = [...man.values()].find(m => m.type === 'application/x-dtbncx+xml');
      if (ncx && zip.has(ncx.path)){
        const d = xml(await zip.text(ncx.path));
        const map = q(d, 'navMap')[0];

      }
    }
  } catch (e) { toc = []; }
  toc.forEach(e => e.idx = spine.findIndex(s => s.path === e.path));
  toc = toc.filter(e => e.idx >= 0);
  if (!landmark){
    for (const r of q(opf, 'reference')){
      if (/^(text|bodymatter)$/i.test(r.getAttribute('type') || '')){ landmark = resolvePath(dir, r.getAttribute('href') || ''); break; }
    }
  }

  let total = 0;
  for (const s of spine){
    const e = zip.find(s.path);
    s.w = Math.max(1, e ? e.usize : 1);
    s.start = total;
    total += s.w;
  }
  return {zip, title, author, spine, toc, total, types, start: pickStart(toc, spine, landmark), coverPath: cov && cov.path, coverType: cov && cov.type};
}
async function shrinkCover(blob){
  try {
    const bmp = await createImageBitmap(blob);
    const s = Math.min(1, 360 / bmp.width);
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || blob), 'image/jpeg', .82));
  } catch (e) { return blob; }
}

let dbp;
const db = () => dbp || (dbp = new Promise((res, rej) => {
  const r = indexedDB.open('alcove', 1);
  r.onupgradeneeded = () => { r.result.createObjectStore('books', {keyPath:'id'}); r.result.createObjectStore('files'); };

async function idb(store, mode, fn){

}

let lib = [], editing = false, coverUrls = [];

  lib.sort((a, b) =>

    by === 'author' ? (tc(a.author, b.author) || tc(a.title, b.title)) :

async function delBook(id){

async function addFiles(files){
  files = [...files];
  let added = 0, dup = 0, offline = false; const failed = [];
  for (let n = 0; n < files.length; n++){
    const f = files[n];
    toast(files.length > 1 ? `adding ${n + 1} of ${files.length}…` : 'adding…', true);
    try {
      const sig = f.name + '|' + f.size;
      if (lib.some(b => b.sig === sig)){ dup++; continue; }
      const isPdf = /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
      let info;
      if (isPdf){
        try { info = await parsePdfInfo(f); } catch (e) { if (e && e.message === 'PDFJS_OFFLINE') offline = true; throw e; }
      } else {
        const bk = await parseBook(f);
        let cover = null;
        if (bk.coverPath){ try { cover = await shrinkCover(await bk.zip.blobOf(bk.coverPath, bk.coverType)); } catch (e) {} }
        info = {title: bk.title, author: bk.author, cover};
      }
      const id = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));
      await dbPut('files', f.slice(0, f.size, isPdf ? 'application/pdf' : 'application/epub+zip'), id);
      await dbPut('books', {id, sig, kind: isPdf ? 'pdf' : 'epub', title: info.title || f.name.replace(/\.(epub|pdf)$/i, ''), author: info.author || '', cover: info.cover, added: Date.now(), opened: 0, v: 2, startedAt: 0, lastReadAt: 0, finishedAt: 0, pos: null, pct: 0, bm: [], hl: []});
      added++;
      lib = (await dbAll());
    } catch (err) { console.error(err); failed.push(f.name); }
  }
  await loadLib();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (offline) toast('PDFs need an internet connection the first time you add one');
  else if (failed.length) toast(`couldn't read ${failed[0]}${failed.length > 1 ? ' and others' : ''}. It may be copy-protected.`);
  else if (dup && !added) toast('already on your shelf');
  else if (added) toast(added === 1 ? 'added' : `added ${added} books`);
  else hideToast();
}

async function rewrite(doc, path){
  const dir = dirOf(path), jobs = [];
  const urlFor = async href => {
    if (!href || /^(https?:|data:|blob:|#)/i.test(href)) return null;
    try { return await R.book.url(resolvePath(dir, href)); } catch (e) { return null; }
  };
  doc.querySelectorAll('script,link,style,iframe,object,embed,meta,base,audio,video,form,frame,frameset').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(n => {
    for (const at of [...n.attributes]){
      const k = at.name.toLowerCase();
      if (k.startsWith('on') || k === 'srcdoc' || k === 'formaction') n.removeAttribute(at.name);
      else if ((k === 'href' || k === 'xlink:href' || k === 'src') && /^\s*(javascript|vbscript):/i.test(at.value)) n.removeAttribute(at.name);
    }
  });
  doc.querySelectorAll('img').forEach(img => {
    jobs.push(urlFor(img.getAttribute('src')).then(u => { if (u) img.setAttribute('src', u); img.removeAttribute('srcset'); img.removeAttribute('loading'); }));
  });
  doc.querySelectorAll('image').forEach(el => {
    const attr = el.getAttribute('xlink:href') ? 'xlink:href' : 'href';
    jobs.push(urlFor(el.getAttribute(attr)).then(u => { if (u){ el.setAttribute('xlink:href', u); el.setAttribute('href', u); } }));
  });
  await Promise.all(jobs);
}

    const se = d.scrollingElement || d.documentElement;
    const sec = d.querySelector('.a-ch[data-i="' + R.i + '"]');
    if (!sec) return;
    const rc = anchored ? targetRect(target) : null;
    if (rc) se.scrollTop = rc.top + se.scrollTop - 12;

      const top = sec.getBoundingClientRect().top + se.scrollTop;

function gotoChapter(idx, target, animate){

}
function gotoPage(p, animate = true){
  closeHlbar(true);

  R.wrap.style.transition = animate && !reduceMotion ? 'transform .22s ease' : 'none';

function scrollUpdate(){

let extending = false;
async function extend(){
  const d = R.doc;
  if (extending || S.layout !== 'scroll' || !d || !R.book) return;
  const tok = R.token, se = d.scrollingElement || d.documentElement, wrap = R.wrap, n = R.book.spine.length;
  extending = true;
  let again = false;
  try {
    if (R.hi < n - 1 && se.scrollTop + se.clientHeight * 3 > se.scrollHeight){
      const ch = await chapterHtml(R.hi + 1);
      if (tok !== R.token || R.doc !== d) return;
      wrap.insertAdjacentHTML('beforeend', section(R.hi + 1, ch.body));
      hlApply(wrap.querySelector('.a-ch[data-i="' + (R.hi + 1) + '"]'));
      R.hi++;
      if (R.hi === n - 1) wrap.insertAdjacentHTML('beforeend', '<div id="a-endmark">the end</div>');
      again = true;
    } else if (R.lo > 0 && se.scrollTop < se.clientHeight * 2){
      const ch = await chapterHtml(R.lo - 1);
      if (tok !== R.token || R.doc !== d) return;
      await preload(ch.body);
      if (tok !== R.token || R.doc !== d) return;
      const h0 = se.scrollHeight;
      wrap.insertAdjacentHTML('afterbegin', section(R.lo - 1, ch.body));
      hlApply(wrap.querySelector('.a-ch[data-i="' + (R.lo - 1) + '"]'));

const next = () => {

};
const prev = () => {

};
function nextChapter(){
  if (R.i < R.book.spine.length - 1) loadChapter(R.i + 1, {frac: 0}); else toast('the end');
}

function chapterLabel(){
  let label = '';
  for (const e of R.book.toc){ if (e.idx <= R.i) label = e.label; else break; }
  return label;
}
function overall(){
  const s = R.book.spine[R.i];

}
let saveTimer, mkTimer;
function progress(){
  let p, label;
  if (R.kind === 'pdf'){ p = P.n ? ((P.cur - 1) + P.frac) / P.n : 0; label = 'page ' + P.cur + ' of ' + P.n; }
  else { p = overall(); label = chapterLabel(); }
  const pct = Math.round(p * 100) + '%';
  $('#pct').textContent = pct; $('#chap').textContent = label;
  $('#slider').value = Math.round(p * 1000);
  $('#sl1').textContent = label; $('#sl2').textContent = pct;
  clearTimeout(saveTimer); saveTimer = setTimeout(flushSave, 600);
  clearTimeout(mkTimer); mkTimer = setTimeout(refreshMark, 300);
}
function flushSave(){
  clearTimeout(saveTimer);
  if (!R.meta || !(R.book || R.pdf)) return;
  let pos;
  if (R.kind === 'pdf'){
    if (!P.doc) return;
    pos = {page: P.cur, frac: P.frac}; R.meta.pct = P.n ? ((P.cur - 1) + P.frac) / P.n : 0;
  } else {
    pos = {i: R.i, frac: R.frac};
    const an = currentAnchor();
    if (an && an.i === R.i) pos.off = an.off;
    R.meta.pct = overall();
  }
  pos.t = Date.now(); R.meta.pos = pos;
  trackDates(R.meta, pos);
  try { localStorage.setItem('alcove.pos.' + R.meta.id, JSON.stringify(pos)); } catch (e) {}
  dbPut('books', R.meta).catch(() => {});
}
function trackDates(m, pos){
  const now = pos.t;

  else if (!m.startedAt && !m.legacy && (R.openKey.key !== key || Math.abs((pos.frac || 0) - R.openKey.frac) > 0.003)) m.startedAt = now;

  else done = done || (R.book.spine.length > 1 && R.i === R.book.spine.length - 1 && (pos.frac || 0) >= 0.9);

}
function bestPos(meta){
  let a = meta.pos || null, b = null;
  try { b = JSON.parse(localStorage.getItem('alcove.pos.' + meta.id) || 'null'); } catch (e) {}

}
function setChrome(on){ $('#reader').classList.toggle('show', on); }
function tap(x){

    const w = R.geo.w;
    if ($('#reader').classList.contains('show')) return setChrome(false);
    if (x < w * 0.3) prev(); else if (x > w * 0.7) next(); else setChrome(true);
  } else setChrome(!$('#reader').classList.contains('show'));
}
function clearBack(){
  R.back = []; clearTimeout(R.pillT);
  $('#backpill').hidden = true;
}
function followLink(href){
  if (/^(https?:|mailto:|tel:)/i.test(href)){ window.open(href, '_blank', 'noopener'); return; }
  const [pp, frag] = href.split('#');
  const cur = R.book.spine[R.i].path;
  const path = pp ? resolvePath(dirOf(cur), pp) : cur;
  const idx = R.book.spine.findIndex(s => s.path === path);

  $('#backpill').hidden = false;

function tagInline(d){
  d.querySelectorAll('img').forEach(im => { if (im.complete && im.naturalHeight && im.naturalHeight <= 48) im.classList.add('a-inl'); });
}
function bindDoc(d){
  let sx = 0, sy = 0;
  tagInline(d);
  d.addEventListener('selectionchange', onSelChange);
  d.addEventListener('load', e => {
    const t = e.target;
    if (t && t.tagName === 'IMG' && t.naturalHeight && t.naturalHeight <= 48) t.classList.add('a-inl');
  }, true);
  d.addEventListener('touchstart', e => { const t = e.changedTouches[0]; sx = t.clientX; sy = t.clientY; }, {passive: true});

  }, {passive: true});

    const sel = d.getSelection && d.getSelection().toString();

    const el = e.target.closest ? e.target : e.target.parentElement;

  });

  }, {passive: true});

/* =============== bookmarks + highlights =============== */
const uid = () => Math.random().toString(36).slice(2, 10);
let HB = {mode: null}, CS = null, selT = 0;
function secOf(node){
  const el = node && (node.nodeType === 1 ? node : node.parentElement);
  return el && el.closest ? el.closest('.a-ch') : null;
}
function charOffset(sec, node, off){
  const r = sec.ownerDocument.createRange(); r.selectNodeContents(sec); r.setEnd(node, off); return r.toString().length;
}
function textPos(sec, off, isEnd){
  const w = sec.ownerDocument.createTreeWalker(sec, 4); let n, acc = 0, last = null;
  while ((n = w.nextNode())){
    const l = n.data.length;
    if (isEnd ? off <= acc + l : off < acc + l) return {n, o: off - acc};
    acc += l; last = n;
  }
  return last && off === acc ? {n: last, o: last.data.length} : null;
}
function rangeAt(sec, off){
  const p = textPos(sec, off, false); if (!p) return null;
  const r = sec.ownerDocument.createRange(); r.setStart(p.n, p.o); r.setEnd(p.n, Math.min(p.n.data.length, p.o + 1)); return r;
}
function targetRect(t){
  const d = R.doc; if (!d) return null;
  const rectOf = el => el.getClientRects()[0] || el.getBoundingClientRect();
  if (t.frag !== undefined){ const el = findFrag(t.frag); if (el) return rectOf(el); }
  if (t.hl){ const el = d.querySelector('mark.a-hl[data-id="' + t.hl + '"]'); if (el) return rectOf(el); }
  if (t.off !== undefined && t.off !== null){
    const sec = d.querySelector('.a-ch[data-i="' + R.i + '"]');
    const r = sec && rangeAt(sec, t.off);
    if (r){ const rc = rectOf(r); if (rc && (rc.width || rc.height)) return rc; }
  }
  return null;
}
function wordRange(d, x, y){
  const r = d.caretRangeFromPoint ? d.caretRangeFromPoint(x, y) : null;
  if (!r || r.startContainer.nodeType !== 3) return null;
  const t = r.startContainer.data; let a = r.startOffset, b = a;
  while (a > 0 && /\S/.test(t[a - 1])) a--;
  while (b < t.length && /\S/.test(t[b])) b++;
  if (a === b) return null;
  const w = d.createRange(); w.setStart(r.startContainer, a); w.setEnd(r.startContainer, b); return w;
}
function caretAt(d, x, y, dir){
  for (let k = 0; k < 8; k++){
    const c = d.caretRangeFromPoint ? d.caretRangeFromPoint(x, y + k * 28 * (dir || 1)) : null;
    if (c && c.startContainer.nodeType === 3){
      const sec = secOf(c.startContainer);
      if (sec) return {i: Number(sec.dataset.i), off: charOffset(sec, c.startContainer, c.startOffset)};
    }
  }
  return null;
}
function currentAnchor(){
  if (!R.doc || !R.geo || R.kind === 'pdf') return null;
  const g = R.geo;
  try { return S.layout === 'pages' ? caretAt(R.doc, g.px + 8, g.py + 6) : caretAt(R.doc, g.px + 8, 20); } catch (e) { return null; }
}
function visibleRange(){
  const a = currentAnchor(); if (!a) return null;
  const g = R.geo; let b = null;
  try { b = S.layout === 'pages' ? caretAt(R.doc, g.w - g.px - 12, g.h - g.py - 12, -1) : caretAt(R.doc, g.px + 8, g.h - 24, -1); } catch (e) {}
  return {i: a.i, a: a.off, b: (b && b.i === a.i && b.off >= a.off) ? b.off : a.off + 2500};
}
function labelFor(i){
  let label = '';
  for (const e of R.book.toc){ if (e.idx <= i) label = e.label; else break; }
  return label;
}
function saveMarks(){
  clearTimeout(R.mt2);
  R.mt2 = setTimeout(() => { if (R.meta) dbPut('books', R.meta).catch(() => {}); }, 250);
}

/* ---- bookmarks ---- */
function bmHere(){
  const bms = (R.meta && R.meta.bm) || [];
  if (R.kind === 'pdf') return bms.filter(b => b.page === P.cur);
  const v = visibleRange(), ci = v ? v.i : R.i;
  return bms.filter(b => b.i === ci && (v && b.off != null ? (b.off >= v.a - 1 && b.off <= v.b) : (b.off == null && Math.abs((b.frac || 0) - R.frac) < 0.02)));
}
function refreshMark(){

  $('#bmBtn').classList.toggle('on', on); $('#bmMark').hidden = !on;

async function toggleBookmark(){

  else if (R.kind === 'pdf'){

    try {
      const pg = await P.doc.getPage(P.cur), tc = await pg.getTextContent();
      snippet = tc.items.map(x => x.str).join(' ').replace(/\s+/g, ' ').trim().slice(0, 110);
    } catch (e) {}

  } else {

    let snippet = '';
    if (v){ const sec = R.doc.querySelector('.a-ch[data-i="' + i + '"]'); if (sec) snippet = sec.textContent.slice(v.a, v.a + 200).replace(/\s+/g, ' ').trim().slice(0, 110); }

/* ---- highlights ---- */
function applyHl(sec, h){
  if (sec.querySelector('mark.a-hl[data-id="' + h.id + '"]')) return;
  const a = textPos(sec, h.s, false), b = textPos(sec, h.e, true);
  if (!a || !b) return;
  const d = sec.ownerDocument, nodes = [], w = d.createTreeWalker(sec, 4);
  let n, inside = false;
  while ((n = w.nextNode())){
    if (n === a.n) inside = true;
    if (inside) nodes.push(n);
    if (n === b.n) break;
  }
  nodes.forEach(node => {
    const so = node === a.n ? a.o : 0, eo = node === b.n ? b.o : node.data.length;
    if (eo <= so) return;
    const r = d.createRange(); r.setStart(node, so); r.setEnd(node, eo);
    const m = d.createElement('mark'); m.className = 'a-hl c' + h.c; m.dataset.id = h.id;
    try { r.surroundContents(m); } catch (e) {}
  });
}
function hlApply(sec){
  if (!sec || !R.meta) return;

  (R.meta.hl || []).filter(h => h.i === i).sort((x, y) => x.t - y.t).forEach(h => applyHl(sec, h));
}
function removeHlDom(id){

}
function createHighlight(range, c){

  const s = charOffset(sec, range.startContainer, range.startOffset), e = charOffset(sec, range.endContainer, range.endOffset);
  if (e - s < 1) return;
  const h = {id: uid(), i: Number(sec.dataset.i), s, e, c, text: range.toString().replace(/\s+/g, ' ').trim().slice(0, 500), t: Date.now()};
  if (!R.meta.hl) R.meta.hl = [];
  R.meta.hl.push(h); applyHl(sec, h); saveMarks();
}
function clearSel(){

}

/* custom long-press + drag selection for page mode */
function drawSel(){

/* ---- lists in the contents sheet ---- */
let sheetTab = 'contents';
function buildContents(body){
  body.replaceChildren();

  if (!names.includes(sheetTab)) sheetTab = 'contents';
  const tabs = document.createElement('div'); tabs.className = 'tabs';
  names.forEach(n => {
    const b = document.createElement('button'); b.textContent = n; b.className = n === sheetTab ? 'on' : '';
    b.onclick = () => { sheetTab = n; buildContents(body); };
    tabs.append(b);
  });
  const list = document.createElement('div');
  body.append(tabs, list);
  if (sheetTab === 'contents') buildToc(list);
  else if (sheetTab === 'bookmarks') buildBookmarks(list, body);

}
function markRow(main, sub, color, onGo, onDel){
  const row = document.createElement('div'); row.className = 'mk';
  if (color) row.style.borderLeft = '3px solid ' + color;
  const tx = document.createElement('button'); tx.className = 'tx';

const CRC_T = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++){ let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();

  return (c ^ 0xFFFFFFFF) >>> 0;
}

    const data = e.bytes || e.blob, size = e.bytes ? e.bytes.length : e.blob.size;
    if (size > 0xFFFFFFFF) throw new Error('a file is too large for the backup format');

    lh.setUint16(10, dt, true); lh.setUint16(12, dd, true); lh.setUint32(14, crc, true); lh.setUint32(18, size, true); lh.setUint32(22, size, true);
    lh.setUint16(26, nm.length, true);
    parts.push(lh.buffer, nm, data);
    const ch = new DataView(new ArrayBuffer(46));
    ch.setUint32(0, 0x02014b50, true); ch.setUint16(4, 20, true); ch.setUint16(6, 20, true); ch.setUint16(8, 0x0800, true);

    const hit = existing.find(b => b.id === rec.id) || (rec.sig && existing.find(b => b.sig === rec.sig)) || (rec.title && existing.find(b => norm(b) === norm(rec)));
    if (hit){ mergeInto(hit, rec); await dbPut('books', hit); res.merged++; continue; }
    if (pkg.kind !== 'full' || !rec.file || !pkg.zip.has(rec.file)){ res.skipped++; continue; }
    try {
      const type = rec.kind === 'pdf' ? 'application/pdf' : 'application/epub+zip';
      const file = await pkg.zip.sliceOf(rec.file, type);
      const meta = {...rec, cover: null}; delete meta.file; delete meta.cover;
      meta.cover = rec.cover && pkg.zip.has(rec.cover) ? await pkg.zip.sliceOf(rec.cover, 'image/jpeg') : null;
      meta.v = 2;
      await dbPut('files', file, meta.id); await dbPut('books', meta);
      if (meta.pos){ try { localStorage.setItem('alcove.pos.' + meta.id, JSON.stringify(meta.pos)); } catch (e) {} }
      existing.push(meta); res.added++;
    } catch (e) { console.error(e); res.skipped++; }
  }
  return res;
}

let BK = {};
const ago = t => { const d = Math.floor((Date.now() - t) / 864e5); return d < 1 ? 'today' : d === 1 ? 'yesterday' : d + ' days ago'; };
function lastBackupAt(){ try { return Number(localStorage.getItem('alcove.lastBackup')) || 0; } catch (e) { return 0; } }
function renderBkNote(){
  const t = lastBackupAt(), el = $('#bkNote');
  el.textContent = !lib.length ? '' : t ? 'last backup ' + ago(t) : 'no backup yet';
}
function buildBackup(body){
  body.replaceChildren();
  const note = txt => { const d = document.createElement('div'); d.className = 'empty'; d.textContent = txt; body.append(d); };
  const act = (main, sub, fn, cls) => {
    const b = document.createElement('button'); b.className = 'toc' + (cls ? ' ' + cls : '');
    b.append(main); if (sub){ const s = document.createElement('div'); s.className = 'sub'; s.textContent = sub; b.append(s); }
    b.onclick = async () => {
      if (BK.busy) return; BK.busy = true;
      try { await fn(); } catch (e) { console.error(e); toast(e && /too large/.test(e.message) ? e.message : 'something went wrong. nothing was changed.'); }
      BK.busy = false;
    };
    body.append(b);
  };
  const make = (fn, kind) => async () => {
    if (!lib.length){ toast('nothing on your shelf yet'); return; }
    const f = await fn(); hideToast(); BK.out = {file: f, kind}; buildBackup(body);
  };
  if (BK.out){
    const mb = BK.out.file.size / 1048576;
    note(`ready: ${BK.out.file.name} (${mb < 0.1 ? '<0.1' : mb.toFixed(mb < 10 ? 1 : 0)} MB)`);
    act('save or share…', 'send it to Files, iCloud Drive, AirDrop and so on', async () => {
      if (await deliver(BK.out.file)){
        if (BK.out.kind === 'full'){ try { localStorage.setItem('alcove.lastBackup', String(Date.now())); } catch (e) {} renderBkNote(); }
        toast('done');
      }
    });
    act('back', '', async () => { BK.out = null; buildBackup(body); });
    return;
  }
  if (BK.pkg){
    const p = BK.pkg, hl = p.books.reduce((a, b) => a + b.hl.length, 0), bm = p.books.reduce((a, b) => a + b.bm.length, 0);
    note(`${p.kind === 'full' ? 'full backup' : 'notes only'}${p.created ? ' from ' + fmtDate(p.created) : ''}: ${p.books.length} book${p.books.length === 1 ? '' : 's'}, ${hl} highlight${hl === 1 ? '' : 's'}, ${bm} bookmark${bm === 1 ? '' : 's'}.` +
      (p.kind === 'notes' ? ' Notes are matched to books already on this shelf.' : ''));
    const done = r => {
      BK.pkg = null; loadLib();
      const bits = [];
      if (r.added) bits.push(`${r.added} added`);
      if (r.merged) bits.push(`${r.merged} updated`);
      if (r.skipped) bits.push(`${r.skipped} skipped`);
      toast(bits.join(', ') || 'nothing to import', false); buildBackup(body);
    };
    act('merge into my shelf', 'keeps what you have, adds the rest, keeps the newer reading position', async () => done(await applyImport(p, 'merge')));
    if (p.kind === 'full') act('replace my shelf', 'removes everything here first, then restores the backup', async () => {
      if (!confirm('Replace everything on this shelf with the backup? Books and notes that are not in the backup will be removed from this device.')) return;
      done(await applyImport(p, 'replace'));
    }, 'bad');
    act('cancel', '', async () => { BK.pkg = null; buildBackup(body); });
    return;
  }
  const t = lastBackupAt();
  note(t ? `last full backup: ${fmtStamp(t)}.` : 'No full backup yet. Your books live only in this browser, so a backup is worth making.');
  act('full backup', 'books, reading positions, bookmarks, highlights, dates and settings in one .alcove file', make(exportFull, 'full'));
  act('notes only', 'a small file with just your highlights, bookmarks, progress and dates', make(exportNotes, 'notes'));
  act('highlights as text', 'a readable .md file you can open anywhere', make(exportText, 'text'));
  act('import from a file…', 'restore a full backup or notes file', async () => { $('#bkFile').click(); });
}

function openSheet(kind, arg){

function buildToc(body){

  const entries = bk.toc.length ? bk.toc : bk.spine.map((s, i) => ({label: 'Section ' + (i + 1), depth: 0, idx: i, frag: ''}));
  let curEl = null, curIdx = -1;
  entries.forEach((e, n) => { if (e.idx <= R.i) curIdx = n; });
  entries.forEach((e, n) => {
    const b = document.createElement('button'); b.className = 'toc' + (n === curIdx ? ' cur' : '');
    b.style.paddingLeft = (22 + e.depth * 18) + 'px'; b.textContent = e.label;

function datesHtml(){
  return `<label for="dStart">started</label><input id="dStart" type="date" class="dt">

function bindDates(root, m, live){
  const st = {s: m.startedAt || 0, f: m.finishedAt || 0, cleared: !!m.finishedCleared};
  const $s = root.querySelector('#dStart'), $f = root.querySelector('#dEnd'), $b = root.querySelector('#dFin');
  root.querySelector('#dLast').textContent = fmtStamp(lastRead(m));
  const paint = () => {
    $s.value = toInput(st.s); $f.value = toInput(st.f);
    $b.textContent = st.f ? 'mark as unfinished' : 'mark as finished';
  };
  const apply = () => { m.startedAt = st.s; m.finishedAt = st.f; m.finishedCleared = st.cleared; };
  const commit = () => { if (live){ apply(); dbPut('books', m).catch(() => {}); } };
  $s.onchange = () => { st.s = fromInput($s.value); commit(); };
  $f.onchange = () => { st.f = fromInput($f.value); st.cleared = !st.f; commit(); };
  $b.onclick = e => {
    e.preventDefault();
    if (st.f){ st.f = 0; st.cleared = true; }
    else { st.f = Date.now(); st.cleared = false; if (!st.s && !m.legacy) st.s = m.startedAt || st.f; }
    paint(); commit();
  };
  paint();
  return apply;
}

const gz = $('#gesture');
let gx = 0, gy = 0, touchTap = 0, lpTimer = 0;
function imageSrc(el){
  if (!el || !el.closest) return null;
  const im = el.closest('img');
  if (im){ const r = im.getBoundingClientRect(); return (im.src && r.width >= 60 && r.height >= 60) ? im.src : null; }
  const sv = el.closest('svg');
  if (sv){
    const i = sv.querySelector('image'), r = sv.getBoundingClientRect();
    const u = i && (i.getAttribute('href') || i.getAttribute('xlink:href'));
    return (u && r.width >= 60 && r.height >= 60) ? u : null;
  }
  return null;
}
const lb = $('#lb'), lbImg = $('#lbImg'), lbWrap = $('#lbWrap');
let lbZ = 1, lbFit = {w: 0, h: 0};
function lbApply(){ lbImg.style.width = lbFit.w * lbZ + 'px'; lbImg.style.height = lbFit.h * lbZ + 'px'; }
function lbLayout(){
  const nw = lbImg.naturalWidth || 1, nh = lbImg.naturalHeight || 1;
  const fs = Math.min(lb.clientWidth / nw, lb.clientHeight / nh, 2.5);
  lbFit = {w: nw * fs, h: nh * fs}; lbApply();
}
function lbSetZoom(nz, cx, cy){
  nz = Math.max(1, Math.min(6, nz)); if (nz === lbZ) return;
  const ux = (lb.scrollLeft + cx) / lbWrap.offsetWidth, uy = (lb.scrollTop + cy) / lbWrap.offsetHeight;
  lbZ = nz; lbApply();
  lb.scrollLeft = ux * lbWrap.offsetWidth - cx; lb.scrollTop = uy * lbWrap.offsetHeight - cy;
}
function openLightbox(url){
  R.lastAct = Date.now();
  lbZ = 1; lbImg.onload = lbLayout; lbImg.src = url;
  lb.hidden = false; lb.scrollTo(0, 0);
  if (lbImg.complete && lbImg.naturalWidth) lbLayout();
}
function closeLightbox(){ lb.hidden = true; lbImg.removeAttribute('src'); lbImg.style.width = lbImg.style.height = ''; lbZ = 1; }
$('#lbClose').onclick = closeLightbox;
{
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  let d0 = 0, z0 = 1, moved = false, st = null, lastTap = 0;
  lb.addEventListener('touchstart', e => {
    if (e.touches.length === 2){ d0 = dist(e.touches); z0 = lbZ; moved = true; }
    else if (e.touches.length === 1){ moved = false; st = {x: e.touches[0].clientX, y: e.touches[0].clientY}; }
  }, {passive: true});
  lb.addEventListener('touchmove', e => {
    if (e.touches.length === 2){
      e.preventDefault(); moved = true;
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      lbSetZoom(z0 * dist(e.touches) / d0, cx, cy);
    } else if (st){

    else { lastTap = now; setTimeout(() => { if (lastTap === now && lbZ === 1) closeLightbox(); }, 310); }
  }, {passive: true});

function tapAt(x, y){
  if (!R.doc) return;
