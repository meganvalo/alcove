<script>
(() => {
'use strict';
const $ = s => document.querySelector(s);

/* =============== settings =============== */
const THEMES = {
  black:    {bg:'#000000', fg:'#d6d6d6', dim:'#7e7e82'},
  graphite: {bg:'#1c1c1e', fg:'#dcdcde', dim:'#8e8e93'},
  light:    {bg:'#fbfaf8', fg:'#222224', dim:'#7a7a80'}
};
let S = {size:19, font:'serif', theme:'black', layout:'pages', margin:'normal', spacing:'normal', pdf:'auto'};
try { Object.assign(S, JSON.parse(localStorage.getItem('alcove.settings') || '{}')); } catch (e) {}
function saveSettings(){ try { localStorage.setItem('alcove.settings', JSON.stringify(S)); } catch (e) {} }
const darkQ = matchMedia('(prefers-color-scheme: dark)');
function theme(){ return S.theme === 'auto' ? (darkQ.matches ? 'black' : 'light') : (THEMES[S.theme] ? S.theme : 'black'); }
function applyTheme(){
  const th = theme();
  document.body.dataset.theme = th;
  const inv = S.pdf === 'inverted' || (S.pdf !== 'original' && th !== 'light');
  document.body.dataset.pdf = inv ? 'inv' : 'norm';
  const bg = THEMES[th].bg;
  document.documentElement.style.background = bg;
  document.querySelector('meta[name=theme-color]').setAttribute('content', th === 'light' ? '#000000' : bg);
}
if (darkQ.addEventListener) darkQ.addEventListener('change', () => { if (S.theme === 'auto'){ applyTheme(); if (R.doc) applyLayout(); } });

/* =============== tiny helpers =============== */
let toastTimer;
function toast(msg, sticky){
  const t = $('#toast'); t.textContent = msg; t.classList.add('on');
  clearTimeout(toastTimer);
  if (!sticky) toastTimer = setTimeout(() => t.classList.remove('on'), 2600);
}
const hideToast = () => $('#toast').classList.remove('on');
const dirOf = p => p.includes('/') ? p.slice(0, p.lastIndexOf('/') + 1) : '';
function resolvePath(dir, href){
  href = href.split('#')[0].split('?')[0];
  let p = href;
  try { p = decodeURIComponent(href); } catch (e) {}
  const parts = (p.startsWith('/') ? p.slice(1) : dir + p).split('/');
  const out = [];
  for (const s of parts){ if (s === '..') out.pop(); else if (s && s !== '.') out.push(s); }
  return out.join('/');
}
const xml = t => new DOMParser().parseFromString(t.replace(/^\uFEFF/, ''), 'application/xml');
const q = (doc, name) => [...doc.getElementsByTagNameNS('*', name)];
const MIME = {jpg:'image/jpeg', jpeg:'image/jpeg', png:'image/png', gif:'image/gif', webp:'image/webp', svg:'image/svg+xml'};

/* =============== zip reader (no libraries) =============== */
class Zip {
  constructor(blob){ this.blob = blob; this.entries = new Map(); this.lower = new Map(); }
  async init(){
    const size = this.blob.size;
    const tailLen = Math.min(size, 65557);
    const tail = new DataView(await this.blob.slice(size - tailLen, size).arrayBuffer());
    let eocd = -1;
    for (let i = tailLen - 22; i >= 0; i--){
      if (tail.getUint32(i, true) === 0x06054b50){ eocd = i; break; }
    }
    if (eocd < 0) throw new Error('not a zip');
    const count = tail.getUint16(eocd + 10, true);
    const cdSize = tail.getUint32(eocd + 12, true);
    const cdOff = tail.getUint32(eocd + 16, true);
    const cd = new DataView(await this.blob.slice(cdOff, cdOff + cdSize).arrayBuffer());
    const dec = new TextDecoder();
    let p = 0;
    for (let i = 0; i < count; i++){
      if (cd.getUint32(p, true) !== 0x02014b50) break;
      const method = cd.getUint16(p + 10, true);
      const csize = cd.getUint32(p + 20, true);
      const usize = cd.getUint32(p + 24, true);
      const nlen = cd.getUint16(p + 28, true), elen = cd.getUint16(p + 30, true), clen = cd.getUint16(p + 32, true);
      const off = cd.getUint32(p + 42, true);
      const name = dec.decode(new Uint8Array(cd.buffer, p + 46, nlen));
      const e = {name, method, csize, usize, off};
      this.entries.set(name, e);
      this.lower.set(name.toLowerCase(), e);
      p += 46 + nlen + elen + clen;
    }
  }
  find(name){ return this.entries.get(name) || this.lower.get(name.toLowerCase()) || null; }
  has(name){ return !!this.find(name); }
  async bytes(name){
    const e = this.find(name);
    if (!e) throw new Error('missing ' + name);
    const lh = new DataView(await this.blob.slice(e.off, e.off + 30).arrayBuffer());
    const start = e.off + 30 + lh.getUint16(26, true) + lh.getUint16(28, true);
    const raw = this.blob.slice(start, start + e.csize);
    if (e.method === 0) return new Uint8Array(await raw.arrayBuffer());
    if (e.method === 8){
      const stream = raw.stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return new Uint8Array(await new Response(stream).arrayBuffer());
    }
    throw new Error('unsupported compression');
  }
  async text(name){ return new TextDecoder().decode(await this.bytes(name)); }
  async blobOf(name, type){ return new Blob([await this.bytes(name)], {type}); }
}

/* =============== epub parsing =============== */
function walkNav(ol, depth, out, base){
  for (const li of ol.children){
    if (li.tagName !== 'LI') continue;
    const head = [...li.children].find(c => c.tagName === 'A' || c.tagName === 'SPAN');
    if (head){
      const label = head.textContent.trim().replace(/\s+/g, ' ');
      const href = head.tagName === 'A' ? head.getAttribute('href') : null;
      if (href && label) out.push({label, depth, path: resolvePath(base, href), frag: (href.split('#')[1] || '')});
    }
    const sub = [...li.children].find(c => c.tagName === 'OL');
    if (sub) walkNav(sub, depth + 1, out, base);
  }
}
function walkNcx(el, depth, out, base){
  for (const np of el.children){
    if (np.localName !== 'navPoint') continue;
    const lab = q(np, 'text')[0];
    const content = [...np.children].find(c => c.localName === 'content');
    const src = content && content.getAttribute('src');
    const label = lab ? lab.textContent.trim().replace(/\s+/g, ' ') : '';
    if (src && label) out.push({label, depth, path: resolvePath(base, src), frag: (src.split('#')[1] || '')});
    walkNcx(np, depth + 1, out, base);
  }
}
function pickStart(toc, spine, landmark){
  const skip = /^(cover|title|half.?title|copyright|dedication|contents|table of contents|epigraph|acknowledg|also by|about the|praise|map)/i;
  const want = /^(introduction|intro\b|prologue|prelude|chapter\s*(1|one|i)\b|(part|book)\s*(1|one|i)\b|1(?![0-9])|one$|one[:.\-\u2013\u2014]|i[.:]|i$)/i;
  for (const e of toc){
    const l = e.label.trim();
    if (skip.test(l)) continue;
    if (want.test(l)) return {idx: e.idx, frag: e.frag || ''};
  }
  if (landmark){ const idx = spine.findIndex(s => s.path === landmark); if (idx >= 0) return {idx, frag: ''}; }
  return null;
}
async function parseBook(blob){
  const zip = new Zip(blob);
  await zip.init();
  const cx = xml(await zip.text('META-INF/container.xml'));
  const opfPath = decodeURIComponent(q(cx, 'rootfile')[0].getAttribute('full-path'));
  const opf = xml(await zip.text(opfPath));
  const dir = dirOf(opfPath);

  const man = new Map(), types = new Map();
  for (const it of q(opf, 'item')){
    const m = {path: resolvePath(dir, it.getAttribute('href') || ''), type: it.getAttribute('media-type') || '', props: it.getAttribute('properties') || ''};

    const m = man.get(r.getAttribute('idref'));
    if (m && zip.has(m.path)) spine.push({path: m.path});
  }
  if (!spine.length) throw new Error('empty spine');

  const t = q(opf, 'title')[0], a = q(opf, 'creator')[0];
  const title = t ? t.textContent.trim() : '';
  const author = a ? a.textContent.trim() : '';

  let cov = null;
  for (const m of q(opf, 'meta')) if (m.getAttribute('name') === 'cover') cov = man.get(m.getAttribute('content')) || cov;
  if (!cov) for (const m of man.values()) if (/\bcover-image\b/.test(m.props)) cov = m;
  if (cov && !cov.type.startsWith('image')) cov = null;

  let toc = [], landmark = null;
  try {
    const navItem = [...man.values()].find(m => /\bnav\b/.test(m.props));
    if (navItem && zip.has(navItem.path)){
      const d = new DOMParser().parseFromString(await zip.text(navItem.path), 'text/html');
      const navs = [...d.querySelectorAll('nav')];
      const n = navs.find(x => (x.getAttribute('epub:type') || x.getAttribute('type') || '').includes('toc')) || navs[0];
      const ol = n && n.querySelector('ol');
      if (ol) walkNav(ol, 0, toc, dirOf(navItem.path));
      const lm = navs.find(x => (x.getAttribute('epub:type') || x.getAttribute('type') || '').includes('landmarks'));
      if (lm){
        const la = [...lm.querySelectorAll('a')].find(x => /bodymatter/.test(x.getAttribute('epub:type') || x.getAttribute('type') || ''));
        if (la) landmark = resolvePath(dirOf(navItem.path), la.getAttribute('href') || '');
      }
    }
    if (!toc.length){
      const ncx = [...man.values()].find(m => m.type === 'application/x-dtbncx+xml');
      if (ncx && zip.has(ncx.path)){
        const d = xml(await zip.text(ncx.path));

    }
  }

  let total = 0;
  for (const s of spine){
    const e = zip.find(s.path);
    s.w = Math.max(1, e ? e.usize : 1);
    s.start = total;
    total += s.w;
  }

}
async function shrinkCover(blob){
  try {
    const bmp = await createImageBitmap(blob);
    const s = Math.min(1, 360 / bmp.width);
    const c = document.createElement('canvas');
    c.width = Math.round(bmp.width * s); c.height = Math.round(bmp.height * s);
    c.getContext('2d').drawImage(bmp, 0, 0, c.width, c.height);
    return await new Promise(r => c.toBlob(b => r(b || blob), 'image/jpeg', .82));
  } catch (e) { return blob; }
}

const blobToDataURL = blob => new Promise((res, rej) => {
  const r = new FileReader(); r.onload = () => res(r.result); r.onerror = () => rej(r.error); r.readAsDataURL(blob);

let migrating = false;
async function migrateCovers(){
  if (migrating) return;
  migrating = true;
  let changed = false;
  try {
    for (const b of lib.slice()){
      if (!b.cover || typeof b.cover === 'string') continue;
      let data = null;
      try { if (b.cover.size > 0) data = await blobToDataURL(b.cover); } catch (e) {}
      if (!data || data.length < 200){
        data = null;
        try {
          const file = await dbGet('files', b.id);
          if (file && b.kind !== 'pdf'){
            const bk = await parseBook(file);
            if (bk.coverPath) data = await blobToDataURL(await shrinkCover(await bk.zip.blobOf(bk.coverPath, bk.coverType)));
          } else if (file){
            const info = await parsePdfInfo(file);
            if (info.cover) data = await blobToDataURL(info.cover);
          }
        } catch (e) {}
      }
      try {
        const cur = await dbGet('books', b.id);
        if (cur){ cur.cover = data; await dbPut('books', cur); b.cover = data; changed = true; }
      } catch (e) {}
    }
  } finally { migrating = false; }
  if (changed) renderLib();
}
async function addFiles(files){
  files = [...files];
  let added = 0, dup = 0, offline = false; const failed = [];
  for (let n = 0; n < files.length; n++){
    const f = files[n];
    toast(files.length > 1 ? `adding ${n + 1} of ${files.length}…` : 'adding…', true);
    try {
      const sig = f.name + '|' + f.size;
      if (lib.some(b => b.sig === sig)){ dup++; continue; }
      const isPdf = /\.pdf$/i.test(f.name) || f.type === 'application/pdf';
      let info;
      if (isPdf){
        try { info = await parsePdfInfo(f); } catch (e) { if (e && e.message === 'PDFJS_OFFLINE') offline = true; throw e; }
      } else {
        const bk = await parseBook(f);
        let cover = null;
        if (bk.coverPath){ try { cover = await shrinkCover(await bk.zip.blobOf(bk.coverPath, bk.coverType)); } catch (e) {} }
        info = {title: bk.title, author: bk.author, cover};
      }
      const id = (crypto.randomUUID && crypto.randomUUID()) || (Date.now() + '-' + Math.random().toString(36).slice(2));
      await dbPut('files', f.slice(0, f.size, isPdf ? 'application/pdf' : 'application/epub+zip'), id);
      await dbPut('books', {id, sig, kind: isPdf ? 'pdf' : 'epub', title: info.title || f.name.replace(/\.(epub|pdf)$/i, ''), author: info.author || '', cover: info.cover ? await blobToDataURL(info.cover) : null, added: Date.now(), opened: 0, pos: null, pct: 0, bm: [], hl: []});
      added++;
      lib = (await dbAll());
    } catch (err) { console.error(err); failed.push(f.name); }
  }
  await loadLib();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  if (offline) toast('PDFs need an internet connection the first time you add one');
  else if (failed.length) toast(`couldn't read ${failed[0]}${failed.length > 1 ? ' and others' : ''}. It may be copy-protected.`);
  else if (dup && !added) toast('already on your shelf');
  else if (added) toast(added === 1 ? 'added' : `added ${added} books`);
  else hideToast();
}

async function rewrite(doc, path){
  const dir = dirOf(path), jobs = [];
  const urlFor = async href => {
    if (!href || /^(https?:|data:|blob:|#)/i.test(href)) return null;
    try { return await R.book.url(resolvePath(dir, href)); } catch (e) { return null; }
  };
  doc.querySelectorAll('script,link,style,iframe,object,embed,meta,base,audio,video,form,frame,frameset').forEach(n => n.remove());
  doc.querySelectorAll('*').forEach(n => {
    for (const at of [...n.attributes]){
      const k = at.name.toLowerCase();
      if (k.startsWith('on') || k === 'srcdoc' || k === 'formaction') n.removeAttribute(at.name);
      else if ((k === 'href' || k === 'xlink:href' || k === 'src') && /^\s*(javascript|vbscript):/i.test(at.value)) n.removeAttribute(at.name);
    }
  });
  doc.querySelectorAll('img').forEach(img => {
    jobs.push(urlFor(img.getAttribute('src')).then(u => { if (u) img.setAttribute('src', u); img.removeAttribute('srcset'); img.removeAttribute('loading'); }));
  });
  doc.querySelectorAll('image').forEach(el => {
    const attr = el.getAttribute('xlink:href') ? 'xlink:href' : 'href';
    jobs.push(urlFor(el.getAttribute(attr)).then(u => { if (u){ el.setAttribute('xlink:href', u); el.setAttribute('href', u); } }));
  });
  await Promise.all(jobs);
}

/* ---- bookmarks ---- */

/* =============== PDF (pdf.js, loaded from a CDN the first time) =============== */
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/4.9.155/';
const P = {doc: null, n: 0, cur: 1, frac: 0, z: 1, sizes: [], pgs: [], tops: [], hs: [], io: null, outline: null, raf: 0};
let pdfjsP = null;
function loadPdfJs(){
  if (pdfjsP) return pdfjsP;
  const poly = 'if(!Promise.withResolvers){Promise.withResolvers=function(){let resolve,reject;const promise=new Promise((a,b)=>{resolve=a;reject=b;});return{promise,resolve,reject};};}\n';
  pdfjsP = (async () => {
    try {
      if (!Promise.withResolvers) Promise.withResolvers = function(){ let resolve, reject; const promise = new Promise((a, b) => { resolve = a; reject = b; }); return {promise, resolve, reject}; };
      const lib = await import(PDFJS + 'pdf.min.mjs');
      const wtxt = await (await fetch(PDFJS + 'pdf.worker.min.mjs')).text();
      lib.GlobalWorkerOptions.workerSrc = URL.createObjectURL(new Blob([poly + wtxt], {type: 'text/javascript'}));
      return lib;
    } catch (e) { throw new Error('PDFJS_OFFLINE'); }
  })();
  pdfjsP.catch(() => { pdfjsP = null; });
  return pdfjsP;
}
async function parsePdfInfo(f){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: new Uint8Array(await f.arrayBuffer()), isEvalSupported: false}).promise;
  let title = '', author = '', cover = null;
  try {
    const m = await doc.getMetadata();
    title = ((m.info && m.info.Title) || '').trim(); author = ((m.info && m.info.Author) || '').trim();
    if (/^(microsoft word|untitled)/i.test(title)) title = '';
  } catch (e) {}
  try {
    const pg = await doc.getPage(1), v0 = pg.getViewport({scale: 1}), vp = pg.getViewport({scale: 360 / v0.width});
    const c = document.createElement('canvas'); c.width = Math.round(vp.width); c.height = Math.round(vp.height);
    await pg.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
    cover = await new Promise(r => c.toBlob(r, 'image/jpeg', .82));
  } catch (e) {}
  try { doc.destroy(); } catch (e) {}
  return {title, author, cover};
}
async function openPdfDoc(meta, file, pos){
  const lib = await loadPdfJs();
  const doc = await lib.getDocument({data: new Uint8Array(await file.arrayBuffer()), isEvalSupported: false}).promise;
  Object.assign(P, {doc, n: doc.numPages, cur: 1, frac: 0, z: 1, sizes: [], pgs: [], outline: null, tops: [], hs: []});
  R.pdf = true;
  const n = P.n, first = await doc.getPage(1), v1 = first.getViewport({scale: 1});
  P.sizes[0] = [v1.width, v1.height];
  const limit = Math.min(n, 800);
  for (let st = 1; st < limit; st += 40){
    await Promise.all(Array.from({length: Math.min(40, limit - st)}, (_, k) =>
      doc.getPage(st + k + 1).then(pg => { const v = pg.getViewport({scale: 1}); P.sizes[st + k] = [v.width, v.height]; }).catch(() => {})));
  }
  for (let i = 0; i < n; i++) if (!P.sizes[i]) P.sizes[i] = P.sizes[0];
  const host = $('#pdfPages'); host.replaceChildren();
  for (let i = 0; i < n; i++){ const el = document.createElement('div'); el.className = 'pg'; el.dataset.p = i + 1; host.append(el); P.pgs.push(el); }
  if (P.io) P.io.disconnect();
  P.io = new IntersectionObserver(es => es.forEach(en => {
    const el = en.target; el._vis = en.isIntersecting;
    if (en.isIntersecting) pdfRender(el);
    else if (el._done){ el.replaceChildren(); el._done = null; }
  }), {root: $('#pdfView'), rootMargin: '120% 0px'});

  const st = pos && pos.page ? pos : {page: 1, frac: 0};
  pdfGoto(st.page, st.frac || 0);
}
function pdfLayout(rerender){
  const view = $('#pdfView');
  const baseW = Math.max(200, view.clientWidth - 16);
  P.pgs.forEach((el, i) => {
    const [w, h] = P.sizes[i], s = baseW / w * P.z;
    el.style.width = w * s + 'px'; el.style.height = h * s + 'px'; el.dataset.s = s;
  });
  P.tops = P.pgs.map(el => el.offsetTop); P.hs = P.pgs.map(el => el.offsetHeight);
  if (rerender){ P.pgs.forEach(el => { el._done = null; }); P.io.disconnect(); P.pgs.forEach(el => P.io.observe(el)); }
}
async function pdfRender(el){
  const s = el.dataset.s;
  if (el._done === s || el._busy === s) return;
  el._busy = s;
  try {
    const page = await P.doc.getPage(Number(el.dataset.p));
    let scale = Number(s) * Math.min(window.devicePixelRatio || 1, 2), vp = page.getViewport({scale});
    const px = vp.width * vp.height;
    if (px > 5e6){ scale *= Math.sqrt(5e6 / px); vp = page.getViewport({scale}); }
    const c = document.createElement('canvas'); c.width = Math.floor(vp.width); c.height = Math.floor(vp.height);
    c.style.cssText = 'width:100%;height:100%;display:block';
    await page.render({canvasContext: c.getContext('2d'), viewport: vp}).promise;
    if (el._vis && el.dataset.s === s){ el.replaceChildren(c); el._done = s; }
  } catch (e) {}
  finally { if (el._busy === s) el._busy = null; }
}
function pdfScrolled(){
  if (!P.doc || !P.tops.length) return;
  const view = $('#pdfView'), st = view.scrollTop, y = st + view.clientHeight * 0.25;
  let lo = 0, hi = P.n - 1;
  while (lo < hi){ const m = (lo + hi + 1) >> 1; if (P.tops[m] <= y) lo = m; else hi = m - 1; }
  P.cur = lo + 1;
  P.frac = Math.max(0, Math.min(1, (st - P.tops[lo]) / Math.max(1, P.hs[lo])));

}
function pdfGoto(page, frac){
  page = Math.max(1, Math.min(P.n, page || 1));
  $('#pdfView').scrollTop = P.tops[page - 1] + (frac || 0) * P.hs[page - 1];
  pdfScrolled();
}
function pdfClose(){
  if (P.io) P.io.disconnect();
  const host = $('#pdfPages'); if (host) host.replaceChildren();
  try { P.doc && P.doc.destroy(); } catch (e) {}
  Object.assign(P, {doc: null, pgs: [], tops: [], hs: [], outline: null});

}
async function pdfOutline(){
  if (P.outline) return P.outline;
  const out = [];
  try {
    const walk = async (items, depth) => {
      for (const it of items || []){
        if (out.length > 400) return;
        let page = null;
        try {
          let dest = it.dest;
          if (typeof dest === 'string') dest = await P.doc.getDestination(dest);
          if (Array.isArray(dest) && dest[0] != null) page = typeof dest[0] === 'object' ? (await P.doc.getPageIndex(dest[0])) + 1 : Number(dest[0]) + 1;
        } catch (e) {}

        if (it.items && it.items.length && depth < 3) await walk(it.items, depth + 1);
      }

}
async function buildPdfToc(list){

function openLightbox(url){
  R.lastAct = Date.now();
  lbZ = 1; lbImg.onload = lbLayout; lbImg.src = url;
  lb.hidden = false; lb.scrollTo(0, 0);
  if (lbImg.complete && lbImg.naturalWidth) lbLayout();
}
function closeLightbox(){ lb.hidden = true; lbImg.removeAttribute('src'); lbImg.style.width = lbImg.style.height = ''; lbZ = 1; }
$('#lbClose').onclick = closeLightbox;
{
  const dist = t => Math.hypot(t[0].clientX - t[1].clientX, t[0].clientY - t[1].clientY);
  let d0 = 0, z0 = 1, moved = false, st = null, lastTap = 0;
  lb.addEventListener('touchstart', e => {
    if (e.touches.length === 2){ d0 = dist(e.touches); z0 = lbZ; moved = true; }
    else if (e.touches.length === 1){ moved = false; st = {x: e.touches[0].clientX, y: e.touches[0].clientY}; }
  }, {passive: true});
  lb.addEventListener('touchmove', e => {
    if (e.touches.length === 2){
      e.preventDefault(); moved = true;
      const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2, cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
      lbSetZoom(z0 * dist(e.touches) / d0, cx, cy);
    } else if (st){
      const t = e.touches[0];
      if (Math.abs(t.clientX - st.x) > 8 || Math.abs(t.clientY - st.y) > 8) moved = true;
    }
  }, {passive: false});
  lb.addEventListener('touchend', e => {
    if (e.touches.length > 0 || moved) return;
    const t = e.changedTouches[0], now = Date.now();
    if (now - lastTap < 300){ lastTap = 0; lbSetZoom(lbZ > 1.2 ? 1 : 2.5, t.clientX, t.clientY); }
    else { lastTap = now; setTimeout(() => { if (lastTap === now && lbZ === 1) closeLightbox(); }, 310); }
  }, {passive: true});
}
function tapAt(x, y){
  if (!R.doc) return;
  if (HB.mode){ closeHlbar(true); R.lastAct = Date.now(); return; }
  const shown = $('#reader').classList.contains('show');
  if (!shown){
    const fr = frame.getBoundingClientRect();
    const el = R.doc.elementFromPoint(x - fr.left, y - fr.top);
    const a = el && el.closest && el.closest('a[href]');
    if (a){ followLink(a.getAttribute('href')); return; }
    const mk = el && el.closest && el.closest('mark.a-hl');
    if (mk){ openHlbar('edit', {id: mk.dataset.id}); return; }
    const url = imageSrc(el);
    if (url && x > R.geo.w * 0.3 && x < R.geo.w * 0.7){ openLightbox(url); return; }
  }
  tap(x);
}
gz.addEventListener('touchstart', e => {
  const t = e.changedTouches[0]; gx = t.clientX; gy = t.clientY;
  clearTimeout(lpTimer);
  if (e.touches.length === 1 && S.layout === 'pages' && !$('#reader').classList.contains('show')) lpTimer = setTimeout(() => beginSel(gx, gy), 480);
}, {passive: true});
gz.addEventListener('touchmove', e => {
  const t = e.touches[0];
  if (CS && CS.active){ e.preventDefault(); extendSel(t.clientX, t.clientY); return; }
  if (Math.abs(t.clientX - gx) > 10 || Math.abs(t.clientY - gy) > 10) clearTimeout(lpTimer);
}, {passive: false});
gz.addEventListener('touchend', e => {
  clearTimeout(lpTimer);
  if (CS && CS.active){ e.preventDefault(); touchTap = R.lastAct = Date.now(); endSel(); return; }
  const t = e.changedTouches[0], dx = t.clientX - gx, dy = t.clientY - gy;
  touchTap = R.lastAct = Date.now();
  if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy) * 1.4){ setChrome(false); if (dx < 0) next(); else prev(); }
  else if (Math.abs(dx) < 12 && Math.abs(dy) < 12){ e.preventDefault(); tapAt(t.clientX, t.clientY); }
  else if (S.layout === 'scroll') setChrome(false);
}, {passive: false});
gz.addEventListener('click', e => { if (Date.now() - touchTap < 700) return; tapAt(e.clientX, e.clientY); });
addEventListener('keydown', e => {
  if (e.key === 'Escape'){ if (!lb.hidden) closeLightbox(); else if (!$('#sheet').hidden) closeSheet(); else setChrome(false); return; }
  if (!R.book || $('#reader').hidden) return;
  if (e.key === 'ArrowRight' || e.key === ' '){ e.preventDefault(); next(); }
  else if (e.key === 'ArrowLeft'){ e.preventDefault(); prev(); }
});
let lastTop = -1;
setInterval(() => {
  if (!R.doc || !R.book || S.layout !== 'scroll' || $('#reader').hidden) return;
  try {
    const se = R.doc.scrollingElement || R.doc.documentElement;
    if (se.scrollTop !== lastTop){ lastTop = se.scrollTop; scrollUpdate(); }
    extend();
  } catch (e) {}
}, 250);
let rz;
function relayout(){
  if (R.kind === 'pdf' && P.doc){ const pg = P.cur, fr = P.frac; pdfLayout(true); pdfGoto(pg, fr); }
  else if (R.doc) applyLayout();
}
addEventListener('resize', () => { clearTimeout(rz); rz = setTimeout(relayout, 150); });
addEventListener('orientationchange', () => { clearTimeout(rz); rz = setTimeout(relayout, 350); });
addEventListener('popstate', () => {
  if ($('#reader').hidden) return;
  if (!$('#lb').hidden){ closeLightbox(); try { history.pushState({r: 1}, ''); } catch (e) {} return; }
  if (!$('#sheet').hidden){ closeSheet(); try { history.pushState({r: 1}, ''); } catch (e) {} return; }
  closeBook(true);
});
addEventListener('pagehide', flushSave);
document.addEventListener('visibilitychange', () => { if (document.hidden) flushSave(); });

applyTheme();
loadLib().then(() => {
  let last = null;
  try { last = localStorage.getItem('alcove.last'); } catch (e) {}
  if (last && lib.some(b => b.id === last)) openBook(last);
}).catch(e => { console.error(e); toast('storage is unavailable here'); });
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
